<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAWLY · Epstein &amp; Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ LAWLY DESIGN SYSTEM ============ */
    :root {
      --bg:         #efece4;
      --panel:      #f5f2ec;
      --field:      #ffffff;
      --card:       #fdfcfa;
      --ink:        #24211c;
      --text:       #3a352b;
      --muted:      #8b8478;
      --muted-2:    #5f594d;
      --faint:      #b0a488;
      --line:       #ebe5d8;
      --line-2:     #e8e2d6;
      --line-3:     #e6dfd0;
      --line-soft:  #f0eadd;
      --hist-active:#eae3d3;
      --gold:       #b28a3c;
      --gold-text:  #9a742d;
      --gold-soft:  #faf4e6;
      --btn-bg:     #24211c;
      --btn-fg:     #f6f2e9;
      --user-bg:    #24211c;
      --user-fg:    #f2ede2;
      --green:      #6f8a55;
      --danger:     #a84b2e;
      --sans: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --mono: 'IBM Plex Mono', monospace;
    }
    html[dir="rtl"] { --sans: 'Heebo', system-ui, sans-serif; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
    }
    a { color: var(--gold); text-decoration: none; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #ded4bf; border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    @keyframes floatUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes menuIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes mascotFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
    @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

    .mono { font-family: var(--mono); }
    .kbd { font-family: var(--mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

    /* mascot circle image (crops to face) */
    .lawly-img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; transform: scale(1.78); transform-origin: 50% 8%; }

    /* ============ LOGIN ============ */
    #login-screen {
      width: 430px; max-width: 94vw;
      background: var(--card);
      border: 1px solid var(--line-2);
      border-radius: 22px;
      box-shadow: 0 2px 4px rgba(60,50,25,.04), 0 40px 90px -44px rgba(60,50,25,.4);
      overflow: hidden;
      animation: floatUp .4s ease both;
    }
    .login-top { padding: 44px 40px 30px; text-align: center; }
    .login-mascot {
      width: 132px; height: 132px; margin: 0 auto 20px;
      border-radius: 999px; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
      background: radial-gradient(circle at 50% 44%, #ffffff 0%, #fffdf8 52%, #f6ecd4 100%);
      box-shadow: 0 20px 40px -22px rgba(120,90,30,.4), inset 0 0 0 1px #f2e8cf;
    }
    .login-mascot img { width: 108px; margin-bottom: -4px; animation: mascotFloat 3.6s ease-in-out infinite; }
    .login-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin-bottom: 12px; }
    .login-title { font-family: var(--serif); font-weight: 600; font-size: 44px; letter-spacing: .04em; line-height: 1; color: var(--ink); }
    .login-sub { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
    .login-body { padding: 6px 40px 34px; }
    .login-body label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 9px; }
    .login-body input {
      width: 100%; padding: 14px 16px;
      border: 1px solid var(--line-3); border-radius: 12px;
      background: var(--field); font-family: var(--mono); font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--ink); outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .login-body input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(178,138,60,.12); }
    .login-btn {
      width: 100%; margin-top: 16px; padding: 14px;
      background: var(--btn-bg); color: var(--btn-fg);
      border: none; border-radius: 12px; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer;
      transition: transform .1s, opacity .2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:hover { opacity: .92; }
    .login-btn:active { transform: translateY(1px); }
    .login-btn:disabled { opacity: .55; cursor: not-allowed; }
    .login-error {
      margin-top: 14px; padding: 11px 14px; border-radius: 10px;
      background: #fbeee9; border: 1px solid #f0d3c6; color: var(--danger); font-size: 13px; display: none;
    }
    .login-foot { padding: 0 40px 30px; text-align: center; font-size: 12px; color: var(--faint); }

    /* ============ PORTAL SHELL ============ */
    #portal { display: none; width: 100vw; height: 100vh; }
    #portal.show { display: flex; }

    .sidebar {
      width: 262px; min-width: 262px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding: 18px 14px;
    }
    html[dir="rtl"] .sidebar { border-right: none; border-left: 1px solid var(--line); }

    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px 18px; }
    .brand-badge { width: 36px; height: 36px; border-radius: 999px; overflow: hidden; flex: none; background: #fff; box-shadow: inset 0 0 0 1px #e4d9bf, 0 0 0 1px #efe8d8; }
    .brand-name { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: .04em; color: var(--ink); line-height: 1; }
    .brand-firm { font-size: 8px; letter-spacing: .2em; color: var(--faint); margin-top: 3px; text-transform: uppercase; }
    html[dir="rtl"] .brand-firm { letter-spacing: .04em; text-transform: none; font-size: 9px; }

    .side-btn {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 10px 12px; border-radius: 11px; font-family: inherit; font-size: 13px; cursor: pointer;
      border: none; transition: opacity .15s, background .15s;
    }
    .side-btn.primary { background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; }
    .side-btn.primary:hover { opacity: .9; }
    .side-btn.ghost { margin-top: 8px; border: 1px solid var(--line); background: var(--field); color: var(--muted); font-weight: 500; }
    .side-btn.ghost:hover { background: #fff; }
    .side-btn .grow { margin-left: auto; }
    html[dir="rtl"] .side-btn .grow { margin-left: 0; margin-right: auto; }

    .side-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin: 22px 6px 9px; }
    html[dir="rtl"] .side-label { letter-spacing: .04em; }
    .hist-list { display: flex; flex-direction: column; gap: 2px; }
    .hist-item {
      padding: 9px 11px; border-radius: 10px; font-size: 13px; color: #837a68; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .12s;
    }
    .hist-item:hover { background: #efe8d9; }
    .hist-item.active { background: var(--hist-active); color: var(--ink); font-weight: 500; }

    .side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 14px 6px 4px; border-top: 1px solid var(--line); }
    .logo-chip { height: 36px; border-radius: 999px; overflow: hidden; flex: none; background: #000; box-shadow: 0 0 0 1px #e7dfce; display: flex; align-items: center; padding: 0 13px; }
    .logo-chip img { height: 22px; width: auto; display: block; }
    .side-user-name { font-size: 12px; font-weight: 600; color: var(--ink); }
    .side-user-role { font-size: 11px; color: var(--faint); text-transform: capitalize; }
    .gear { margin-left: auto; color: #c2b591; background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; border-radius: 8px; }
    html[dir="rtl"] .gear { margin-left: 0; margin-right: auto; }
    .gear:hover { color: var(--gold); }

    /* ============ MAIN ============ */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; background: var(--card); }

    .topbar { height: 56px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; padding: 0 22px; }
    .agent-pill { display: flex; align-items: center; gap: 8px; padding: 5px 13px 5px 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
    html[dir="rtl"] .agent-pill { padding: 5px 6px 5px 13px; }
    .agent-pill .dot { width: 20px; height: 20px; border-radius: 999px; overflow: hidden; flex: none; background: #fff; box-shadow: inset 0 0 0 1px #e4d9bf; }
    .agent-pill span.nm { font-size: 13px; font-weight: 600; }
    .topbar .sep { font-size: 12px; color: var(--faint); }
    .topbar .desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .secured { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    html[dir="rtl"] .secured { margin-left: 0; margin-right: auto; }
    .secured .g { width: 6px; height: 6px; border-radius: 999px; background: var(--green); }

    .scroll { flex: 1; overflow-y: auto; padding: 26px 28px 8px; }

    /* welcome */
    .welcome { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 20px; }
    .welcome-mascot {
      width: 260px; height: 260px; border-radius: 999px; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
      background: radial-gradient(circle at 50% 44%, #ffffff 0%, #fffdf8 52%, #f6ecd4 100%);
      box-shadow: 0 30px 60px -30px rgba(120,90,30,.4), inset 0 0 0 1px #f2e8cf; margin-bottom: 22px;
    }
    .welcome-mascot img { width: 212px; margin-bottom: -6px; animation: mascotFloat 3.6s ease-in-out infinite; }
    .welcome h2 { font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 1.04; color: var(--ink); margin-bottom: 8px; }
    .welcome p { font-size: 14.5px; color: var(--muted); max-width: 44ch; margin-bottom: 26px; }
    .suggestions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 440px; }
    .sugg {
      display: flex; align-items: center; gap: 11px; text-align: left; width: 100%;
      padding: 12px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--field);
      font-family: inherit; font-size: 13px; color: var(--text); cursor: pointer; transition: border-color .15s, transform .1s;
    }
    html[dir="rtl"] .sugg { text-align: right; }
    .sugg:hover { border-color: var(--gold); }
    .sugg .d { width: 5px; height: 5px; border-radius: 999px; flex: none; }
    .sugg .l { flex: 1; }
    .sugg .t { font-family: var(--mono); font-size: 11px; color: var(--gold-text); }

    /* messages */
    .thread { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .row-user { display: flex; justify-content: flex-end; animation: floatUp .28s ease both; }
    .bubble-user { max-width: 78%; background: var(--user-bg); color: var(--user-fg); padding: 11px 15px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.55; }
    html[dir="rtl"] .bubble-user { border-radius: 16px 16px 16px 4px; }
    .row-ai { display: flex; gap: 12px; animation: floatUp .28s ease both; }
    .ai-badge { width: 30px; height: 30px; border-radius: 999px; overflow: hidden; flex: none; background: #fff; box-shadow: inset 0 0 0 1px #e4d9bf; }
    .ai-body { flex: 1; min-width: 0; }
    .ai-name { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 5px; }
    .ai-text { font-size: 14px; line-height: 1.65; color: var(--text); }
    .ai-text strong { font-weight: 600; }
    .ai-text em { font-style: italic; }
    .ai-text code { font-family: var(--mono); font-size: 13px; background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }
    .ai-text p + p { margin-top: 10px; }
    .ai-text ul, .ai-text ol { padding-left: 18px; margin-top: 6px; }
    html[dir="rtl"] .ai-text ul, html[dir="rtl"] .ai-text ol { padding-left: 0; padding-right: 18px; }
    .ai-text li { margin-bottom: 4px; }
    .typing { display: inline-flex; gap: 5px; align-items: center; }
    .typing i { width: 7px; height: 7px; border-radius: 999px; background: var(--faint); display: inline-block; animation: blink 1.2s infinite; }
    .typing i:nth-child(2){ animation-delay: .2s; } .typing i:nth-child(3){ animation-delay: .4s; }

    /* composer */
    .composer-wrap { padding: 12px 28px 22px; position: relative; }
    .composer {
      border: 1px solid var(--line-3); border-radius: 18px; background: var(--field);
      box-shadow: 0 3px 10px -5px rgba(60,50,25,.12); padding: 8px 8px 8px 14px;
      display: flex; align-items: flex-end; gap: 10px;
    }
    html[dir="rtl"] .composer { padding: 8px 14px 8px 8px; }
    .composer:focus-within { border-color: var(--gold); }
    .agent-toggle {
      display: flex; align-items: center; gap: 7px; flex: none; padding: 7px 11px; margin-bottom: 2px;
      border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
      font-family: inherit; font-size: 12px; font-weight: 600; color: var(--muted-2); cursor: pointer;
    }
    .agent-toggle .sw { width: 7px; height: 7px; border-radius: 999px; }
    .agent-toggle .car { color: var(--faint); font-size: 10px; }
    #message-input {
      flex: 1; resize: none; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 14px; line-height: 1.5; color: var(--ink); padding: 8px 0; max-height: 120px;
    }
    #message-input::placeholder { color: var(--faint); }
    .send { flex: none; width: 36px; height: 36px; border-radius: 12px; border: none; background: var(--btn-bg); color: var(--btn-fg); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .15s; }
    .send:hover { opacity: .9; }
    .send:disabled { opacity: .4; cursor: not-allowed; }
    .composer-hint { text-align: center; font-size: 11px; color: var(--faint); margin-top: 9px; }

    /* slash menu */
    .slash {
      position: absolute; left: 28px; right: 28px; bottom: 96px;
      background: var(--field); border: 1px solid var(--line-2); border-radius: 16px;
      box-shadow: 0 24px 50px -20px rgba(60,50,25,.4); padding: 8px; max-height: 360px; overflow-y: auto;
      animation: menuIn .16s ease both; z-index: 5; display: none;
    }
    .slash.open { display: block; }
    .slash-label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 8px 10px 6px; }
    .slash-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 11px; border: none; background: transparent; font-family: inherit; cursor: pointer; }
    html[dir="rtl"] .slash-item { text-align: right; }
    .slash-item:hover, .slash-item.hi { background: var(--panel); }
    .slash-item .sw { width: 30px; height: 30px; border-radius: 9px; flex: none; opacity: .2; }
    .slash-item .nm { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
    .slash-item .de { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slash-item .cm { font-family: var(--mono); font-size: 12px; color: var(--gold-text); margin-left: auto; }
    html[dir="rtl"] .slash-item .cm { margin-left: 0; margin-right: auto; }

    /* ============ SETTINGS ============ */
    .settings-view { flex: 1; display: none; overflow: hidden; }
    .settings-view.show { display: flex; }
    .set-nav { width: 250px; background: var(--panel); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; }
    html[dir="rtl"] .set-nav { border-right: none; border-left: 1px solid var(--line); }
    .set-nav-title { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
    .set-nav-title .b { width: 30px; height: 30px; border-radius: 999px; overflow: hidden; flex: none; background: #fff; box-shadow: inset 0 0 0 1px #e4d9bf, 0 0 0 1px #efe8d8; }
    .set-nav-title .t { font-family: var(--serif); font-weight: 600; font-size: 24px; }
    .set-group { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 12px 8px 6px; }
    .set-link { padding: 9px 11px; border-radius: 9px; font-size: 13px; color: #837a68; cursor: pointer; }
    .set-link:hover { background: #efe8d9; }
    .set-link.active { background: var(--hist-active); font-weight: 600; color: #40392c; }
    .set-content { flex: 1; overflow-y: auto; padding: 34px 40px; }
    .set-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
    .set-content h3 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0 0 4px; }
    .set-content p.lede { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; max-width: 60ch; }
    .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .lang { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; }
    .lang.active { border: 1.5px solid var(--gold); background: var(--gold-soft); }
    .lang .flag { width: 26px; height: 26px; border-radius: 7px; background: var(--panel); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
    .lang.active .flag { background: #fff; border: 1px solid var(--line-2); }
    .lang .ln { flex: 1; font-size: 14px; }
    .lang.active .ln { font-weight: 600; }
    .rtl-tag { font-size: 10px; font-family: var(--mono); color: var(--gold-text); background: #f1ead8; padding: 2px 6px; border-radius: 5px; }
    .set-divider { height: 1px; background: #eee7d8; margin: 30px 0; }
    .set-sub { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin-bottom: 10px; }
    .toggle-row { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid #f2ecdf; }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row .info { flex: 1; }
    .toggle-row .info .t { font-size: 14px; font-weight: 600; }
    .toggle-row .info .s { font-size: 12.5px; color: var(--muted); }
    .switch { width: 40px; height: 24px; border-radius: 999px; background: #ded4bf; position: relative; display: inline-block; flex: none; cursor: pointer; transition: background .18s; }
    .switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: #fff; transition: left .18s; }
    .switch.on { background: var(--gold); }
    .switch.on .knob { left: 19px; }
    html[dir="rtl"] .switch .knob { left: auto; right: 3px; }
    html[dir="rtl"] .switch.on .knob { right: 19px; left: auto; }
    .set-back { display: none; }

    @media (max-width: 720px) {
      .sidebar { width: 78px; min-width: 78px; }
      .brand-name, .brand-firm, .side-btn span:not(.grow), .side-label, .hist-list, .side-user-name, .side-user-role { display: none; }
      .set-nav { width: 82px; }
      .set-nav-title .t, .set-group, .set-link span { display: none; }
    }
  </style>
