<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>מוקד המשימות שלי — LAWLY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#fbf9f4;
    --ink:#21232b; --ink-muted:#63667a; --ink-faint:#9497a6;
    --border:#e6e2d6; --border-soft:#efece2;
    --accent:#1f3a5f; --accent-ink:#ffffff; --accent-soft:#e7edf3; --accent-soft-ink:#1f3a5f;
    --urgent:#a7371f; --urgent-soft:#fbeae4; --urgent-ink:#8a2c17;
    --high:#8a5a12; --high-soft:#faf0dc; --high-ink:#734c0f;
    --normal:#3d6485; --normal-soft:#e9f0f6; --normal-ink:#2f4f6b;
    --low:#5f6a5a; --low-soft:#eef1ea; --low-ink:#4c5546;
    --shadow: 0 1px 2px rgba(33,35,43,.04), 0 8px 24px -12px rgba(33,35,43,.14);
    --radius: 14px;
    --font-display:'Frank Ruhl Libre', 'Times New Roman', serif;
    --font-body:'Assistant','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  [hidden]{display:none !important;}

  .app{max-width:900px;margin:0 auto;padding:22px 22px 60px;}
  .topbar{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand-mark{font-weight:800; font-size:12px; letter-spacing:.14em; color:var(--accent-soft-ink); background:var(--accent-soft); padding:4px 8px; border-radius:6px;}
  .topbar h1{font-family:var(--font-display); font-weight:700; font-size:24px; margin:0;}
  .topbar-meta{display:flex; align-items:center; gap:8px; color:var(--ink-muted); font-size:13.5px; margin-inline-end:auto;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#9aa4ad;flex:none; box-shadow:0 0 0 3px rgba(154,164,173,.2);}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 13px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; transition:background .15s, border-color .15s, transform .1s;}
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn svg{width:15px;height:15px;flex:none;}
  .btn.is-loading svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .summary-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
  .stat{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .stat-num{font-family:var(--font-display); font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1;}
  .stat-label{color:var(--ink-muted); font-size:12.5px; margin-top:6px; font-weight:600;}
  .stat.is-urgent .stat-num{color:var(--urgent);}
  @media (max-width:640px){ .summary-row{grid-template-columns:repeat(2,1fr);} }

  .searchbox{position:relative; margin-bottom:12px;}
  .searchbox .s-icon{position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); pointer-events:none;}
  .searchbox input{width:100%; box-sizing:border-box; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 36px; font:inherit; font-size:14px; color:var(--ink); box-shadow:var(--shadow);}
  .searchbox input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .searchbox input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none; appearance:none;}
  .searchbox .s-clear{position:absolute; inset-inline-end:6px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--ink-faint); font-size:17px; line-height:1; cursor:pointer; width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center;}
  .searchbox .s-clear:hover{background:var(--surface-2); color:var(--ink);}

  .composer{display:flex; gap:8px; margin-bottom:14px;}
  .composer input{flex:1; min-width:0; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 14px; font:inherit; font-size:14px; color:var(--ink); box-shadow:var(--shadow);}
  .composer input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  @media (max-width:520px){ .composer{flex-wrap:wrap;} .composer input{width:100%;} }

  .people{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .person-select{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 12px; font:inherit; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); cursor:pointer; max-width:100%;}
  .person-select:disabled{opacity:.6; cursor:default;}
  .person-select-status{color:var(--ink-muted); font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .person-select-status:empty{display:none;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:14px 0 10px; flex-wrap:wrap;}
  .tab{background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px; padding:8px 14px; font-size:14.5px; font-weight:700; color:var(--ink-muted); cursor:pointer;}
  .tab:hover{color:var(--ink);}
  .tab.is-active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab .n{font-weight:600; opacity:.7; font-variant-numeric:tabular-nums; margin-inline-start:4px;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); padding:6px 13px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .chip:hover{border-color:var(--accent);}
  .chip.is-active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .chip .n{opacity:.75; font-variant-numeric:tabular-nums;}

  .group{margin-bottom:22px;}
  .group-head{display:flex; align-items:center; gap:8px; margin-bottom:10px; padding:4px 2px; width:100%; background:none; border:none; cursor:pointer; text-align:start; font:inherit;}
  .group-head .grp-chev{display:inline-flex; flex:none; color:var(--ink-faint); transition:transform .15s;}
  .group-head .grp-chev svg{width:13px;height:13px; display:block;}
  .group-head.is-open .grp-chev{transform:rotate(90deg);}
  .group-head h2{font-family:var(--font-display); font-size:16.5px; font-weight:700; margin:0;}
  .group-head .count{font-size:12px; font-weight:700; color:var(--ink-muted); background:var(--surface-2); border:1px solid var(--border-soft); padding:1px 8px; border-radius:999px; font-variant-numeric:tabular-nums;}
  .group-head.is-urgent h2{color:var(--urgent-ink);}
  .card-stack{display:flex; flex-direction:column; gap:9px;}

  .task{background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; box-shadow:var(--shadow); border-inline-start:4px solid var(--normal); padding:12px 14px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start;}
  .task.is-readonly{grid-template-columns:1fr auto;}
  .task[data-eff="urgent"]{border-inline-start-color:var(--urgent);}
  .task[data-eff="high"]{border-inline-start-color:var(--high);}
  .task[data-eff="normal"]{border-inline-start-color:var(--normal);}
  .task[data-eff="low"]{border-inline-start-color:var(--low);}
  .task.is-done{opacity:.55;}
  .task.is-done .task-title{text-decoration:line-through; text-decoration-color:var(--ink-faint);}
  .task-check{width:21px;height:21px; border-radius:6px; border:1.6px solid var(--ink-faint); background:var(--surface); cursor:pointer; margin-top:2px; flex:none; display:flex; align-items:center; justify-content:center; padding:0;}
  .task-check svg{width:13px;height:13px; opacity:0; stroke:var(--accent-ink);}
  .task.is-done .task-check{background:var(--accent); border-color:var(--accent);}
  .task.is-done .task-check svg{opacity:1;}
  .task-main{min-width:0;}
  .task-toprow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:3px;}
  .src{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--ink-muted);}
  .src svg{width:13px;height:13px;}
  .src.is-lawly{color:#1f8a5f;}
  .who{display:inline-flex; align-items:center; font-size:12px; font-weight:700; color:var(--accent-soft-ink); background:var(--accent-soft); padding:2px 9px; border-radius:999px;}
  .task-title{font-weight:700; font-size:15px; line-height:1.35; margin:0;}
  .task-summary{color:var(--ink-muted); font-size:13.5px; line-height:1.5; margin:4px 0 0; display:flex; flex-direction:column; gap:4px;}
  .summary-line{margin:0;}
  .summary-label{color:var(--ink); font-weight:700;}
  .summary-link-btn{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px; color:var(--accent); vertical-align:middle; margin-inline-start:2px; text-decoration:none;}
  .summary-link-btn:hover{background:var(--accent-soft);}
  .summary-link-btn svg{width:13px;height:13px;}
  .task-editrow{display:flex; gap:8px; margin-top:7px; flex-wrap:wrap;}
  .task-editrow input[type=text], .task-editrow input[type=number]{font-family:inherit; font-size:13.5px; border:1px solid var(--border); border-radius:7px; padding:5px 8px; background:var(--surface-2); color:var(--ink);}
  .task-editrow input[type=text]{flex:1; min-width:160px;}
  .task-editrow input[type=number]{width:64px;}
  .task-metarow{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .task-metarow .deal{font-size:12.5px; font-weight:600; color:var(--accent); text-decoration:none; border:1px solid var(--border); border-radius:999px; padding:2px 9px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .task-metarow .deal:hover{border-color:var(--accent);}
  .closed-why{font-size:12px; color:var(--ink-muted); margin:3px 0 0;}
  .btn.reopen{font-size:12px; padding:3px 9px;}
  .src-name{font-size:12px; color:var(--ink-faint); max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .task-metarow .linkbtn{font-size:12px; font-weight:600; color:var(--ink-muted); background:none; border:1px dashed var(--border); border-radius:999px; padding:2px 9px; cursor:pointer;}
  .task-metarow .linkbtn:hover{color:var(--accent); border-color:var(--accent);}
  .linkbox{flex-basis:100%; display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .linkbox-row{display:flex; gap:6px;}
  .linkbox input{flex:1; min-width:0; font:inherit; font-size:13px; padding:5px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink);}
  .linkbox .lb-results{display:flex; flex-direction:column; gap:3px;}
  .linkbox .lb-item{text-align:start; font:inherit; font-size:12.5px; padding:5px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); cursor:pointer;}
  .linkbox .lb-item:hover{border-color:var(--accent); color:var(--accent);}
  .linkbox .lb-msg{font-size:12px; color:var(--ink-faint);}
  .task-metarow .deal-wrap{display:inline-flex; align-items:center; gap:2px;}
  .task-metarow .deal-x{border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:14px; line-height:1; padding:0 3px;}
  .task-metarow .deal-x:hover{color:var(--accent);}
  .task-metarow .deal-pick{font-size:12.5px; font-weight:600; color:var(--accent); background:var(--surface); border:1px dashed var(--accent); border-radius:999px; padding:2px 8px; max-width:260px; cursor:pointer;}
  .est{font-size:12.5px; color:var(--ink-muted); font-weight:600; display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums;}
  .est svg{width:12px;height:12px;}
  .age{font-size:12.5px; font-weight:600; display:inline-flex; align-items:center; gap:4px;}
  .age.is-warm{color:var(--high);} .age.is-hot{color:var(--urgent);}
  .age svg{width:12px;height:12px;}
  .pill{font-size:11.5px; font-weight:800; letter-spacing:.02em; padding:3px 9px; border-radius:999px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:5px;}
  .pill[data-p="urgent"]{background:var(--urgent-soft); color:var(--urgent-ink);}
  .pill[data-p="high"]{background:var(--high-soft); color:var(--high-ink);}
  .pill[data-p="normal"]{background:var(--normal-soft); color:var(--normal-ink);}
  .pill[data-p="low"]{background:var(--low-soft); color:var(--low-ink);}
  .pill .esc{opacity:.8;}
  .task-actions{display:flex; flex-direction:column; gap:6px; align-items:center;}
  .iconbtn{width:28px;height:28px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none;}
  .iconbtn:hover{background:var(--surface-2); color:var(--ink); border-color:var(--border-soft);}
  .iconbtn svg{width:15px;height:15px;}
  .pmenu{position:relative;}
  .pmenu-list{position:absolute; inset-inline-end:0; top:calc(100% + 4px); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:5px; z-index:5; display:none; min-width:130px;}
  .pmenu.is-open .pmenu-list{display:block;}
  .pmenu-list button{display:flex; width:100%; align-items:center; gap:7px; padding:6px 8px; border-radius:7px; background:none; border:none; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; text-align:start;}
  .pmenu-list button:hover{background:var(--surface-2);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot[data-p="urgent"]{background:var(--urgent);} .dot[data-p="high"]{background:var(--high);}
  .dot[data-p="normal"]{background:var(--normal);} .dot[data-p="low"]{background:var(--low);}
  .empty{color:var(--ink-faint); font-size:13.5px; padding:16px 4px;}
  .error{color:var(--urgent-ink); background:var(--urgent-soft); border:1px solid var(--urgent); border-radius:10px; padding:10px 14px; font-size:13.5px; margin-bottom:14px;}
  .done-toggle{background:none; border:none; color:var(--ink-muted); font-size:13px; font-weight:700; cursor:pointer; padding:6px 2px; display:flex; align-items:center; gap:6px;}
  .done-toggle svg{width:13px;height:13px; transition:transform .15s;}
  .done-toggle.is-open svg{transform:rotate(90deg);}
  .task-more{background:none; border:none; color:var(--ink-muted); font-size:12.5px; font-weight:700; cursor:pointer; padding:3px 0 0; margin:0; display:flex; align-items:center; gap:4px;}
  .task-more:hover{color:var(--ink);}
  .task-more svg{width:11px;height:11px; transition:transform .15s;}
  .task-more[aria-expanded="true"] svg{transform:rotate(90deg);}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">LAWLY</span>
      <h1 data-i18n="title">מוקד המשימות שלי</h1>
    </div>
    <div class="topbar-meta">
      <span class="live-dot" aria-hidden="true"></span>
      <span data-i18n="live">מתעדכן אוטומטית</span>
      <span>·</span>
      <span id="updatedAt" data-i18n="updated">—</span>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="teamToggleBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span id="teamToggleLabel">כל הצוות</span>
      </button>
      <button class="btn" id="langToggle" type="button">EN</button>
      <button class="btn btn-primary" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v6h-6"/></svg>
        <span data-i18n="refresh">רענן</span>
      </button>
    </div>
  </header>

  <div class="composer" id="composer">
    <input type="text" id="composerInput" maxlength="500" autocomplete="off"/>
    <button class="btn btn-primary" id="composerBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="addTask">הוסף משימה</span>
    </button>
  </div>

  <div id="errorBox"></div>
  <div class="summary-row" id="summaryRow"></div>
  <div class="searchbox">
    <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" id="searchInput" autocomplete="off"/>
    <button type="button" id="searchClear" class="s-clear" hidden aria-label="clear">×</button>
  </div>
  <div class="people" id="people" hidden>
    <select id="personSelect" class="person-select"></select>
    <span id="personSelectStatus" class="person-select-status" aria-live="polite"></span>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="filters" id="filters"></div>
  <section id="taskList" aria-live="polite"></section>
</div>

<script>
(function(){
  "use strict";

  var ICONS = {
    email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
    whatsapp:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.4-1.42a9.87 9.87 0 0 0 4.64 1.18h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 1.67c2.2 0 4.26.86 5.82 2.4a8.2 8.2 0 0 1 2.42 5.84c0 4.55-3.7 8.24-8.25 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.55 3.7-8.24 8.25-8.24Z"/></svg>',
    manual:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.4-1.42a9.87 9.87 0 0 0 4.64 1.18h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Z"/></svg>'
  };
  var CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
  var TIMER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6"/></svg>';
  var UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg>';
  var PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  var I18N = {

  };

  // mode 'mine' = the signed-in user's own tasks (default). mode 'team' =
  // the admin-only "see everyone's tasks" view, toggled by #teamToggleBtn
  // (only ever shown to admins — see the isAdmin check near the bottom).
  // Kept as one page/one state object rather than a separate page so
  // switching is instant and reuses all the same rendering/i18n/search code.
  // personFilter: '' = nothing picked yet (team mode's default — nothing
  // fetched until a choice is made), 'all' = the dropdown's explicit
  // "everyone" option (the one case that still loads every user's tasks),
  // or a specific user id (the normal case: just that person's tasks).
  // teamRoster holds {id,name,email,openCount} from the cheap GET
  // /admin/roster call, used to populate the dropdown and to stitch a name
  // onto single-person task rows (which don't carry one server-side).
  var state = {
    lang: 'he', mode: 'mine', filter: 'all', tab: 'all', personFilter: '', doneOpen: false,
    tasks: [], done: [], teamTasks: [], teamRoster: [], teamRosterLoading: false, teamLoading: false,
    search: '', collapsed: {},
    // 2026-09-16 (Shira): task cards now show a collapsed one-liner by
    // default with a "Show details" toggle that reveals the full summary —
    // per-task, keyed by id, since render() rebuilds every card from scratch
    // on every poll/refresh and would otherwise forget what was expanded.
    expandedTasks: {}
  };
  try {
    var savedLang = localStorage.getItem('mytasks-lang');
    if (savedLang === 'he' || savedLang === 'en') state.lang = savedLang;
  } catch (e) { /* private mode etc. — default stands */ }

  var PORDER = { urgent:0, high:1, normal:2, low:3 };

  function t(key, vars){
    var s = I18N[state.lang][key] || key;
    if (vars) for (var k in vars) s = s.replace('{'+k+'}', vars[k]);
    return s;
  }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

  // 2026-09-17 (Shira): "כל נושא שורה נפרדת, שיהיה מודגש המאת/הרקע/הנדרש,
  // וקישור לחיץ (איקון) במקום טקסט" — WhatsApp summaries from the wa-triage
  // skill (see the 2026-09-17 SQL update) come back as separate מאת:/נדרש:/
  // רקע:/קישור לדיל: lines, but escapeHtml(task.summary) alone dumped them
  // into one run-on block since newlines don't create visual breaks without
  // extra markup. This puts each line in its own row, bolds a recognized
  // label, and turns a קישור לדיל line into a small clickable icon instead
  // of printing the raw URL. A summary that doesn't use these labels (an
  // older task, or another source) still renders one line per line with no
  // label bolded, nothing lost or broken for those.
  var KNOWN_SUMMARY_LABELS = ['מאת', 'נדרש', 'רקע', 'קישור לדיל'];
  function summaryLinesHtml(summary){
    var lines = String(summary).split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
    return lines.map(function(line){
      var m = /^([^:：]{1,20})[:：]\s*(.*)$/.exec(line);
      var label = (m && KNOWN_SUMMARY_LABELS.indexOf(m[1].trim()) !== -1) ? m[1].trim() : null;
      var value = m ? m[2].trim() : line;
      if (label === 'קישור לדיל' && /^https:\/\//.test(value)) {
        return '<div class="summary-line"><strong class="summary-label">'+escapeHtml(label)+':</strong> '+
          '<a class="summary-link-btn" href="'+escapeAttr(value)+'" target="_blank" rel="noopener noreferrer" title="'+escapeAttr(t('openDeal'))+'">'+LINK+'</a></div>';
      }
      if (label) {
        return '<div class="summary-line"><strong class="summary-label">'+escapeHtml(label)+':</strong> '+escapeHtml(value)+'</div>';
      }
      return '<div class="summary-line">'+escapeHtml(line)+'</div>';
    }).join('');
  }

  function ageLabel(iso){
    var ms = Date.now() - new Date(iso).getTime();
    var H = 3600*1000, D = 24*H;
    if (ms < 5*60*1000) return t('agoJust');
    if (ms < H) return t('agoMin',{n:Math.max(1,Math.round(ms/60000))});
    if (ms < 2*H) return t('agoHour');
    if (ms < D) return t('agoHours',{n:Math.round(ms/H)});
    if (ms < 2*D) return t('agoDay');
    return t('agoDays',{n:Math.round(ms/D)});
  }
  function ageRatio(task){
    var THRESH = { whatsapp:24, email:48, manual:72 }; // hours
    var hrs = (Date.now() - new Date(task.first_seen_at).getTime()) / 3600000;
    return hrs / (THRESH[task.source] || 72);
  }

  async function api(path, opts){
    var res = await fetch('/api/mytasks' + path, Object.assign({
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin'
    }, opts || {}));
    if (!res.ok) {
      var body = {}; try { body = await res.json(); } catch (e) {}
      throw new Error(body.error || ('HTTP ' + res.status));
    }
    return res.json();
  }

  function showError(msg){
    document.getElementById('errorBox').innerHTML = msg ? '<div class="error">'+escapeHtml(msg)+'</div>' : '';
  }

  async function loadTasks(){
    try {
      var data = await api('');
      state.tasks = (data.tasks || []).filter(function(x){ return x.status === 'open'; });
      state.done = (data.tasks || []).filter(function(x){ return x.status === 'done'; });
      showError(null);
      document.getElementById('updatedAt').textContent = t('agoJust');
    } catch (e) {
      showError(t('errLoad') + ': ' + e.message);
    }
    render();
  }

  // Admin-only, cheap: the active staff roster with an open-task COUNT per
  // person (GET /api/mytasks/admin/roster — an aggregate query, not
  // anyone's actual tasks), to populate the Team view dropdown. This is
  // what opening Team view now fetches, instead of everyone's full task
  // list. 403 here shouldn't normally happen (the toggle button is itself
  // admin-gated), but handled defensively in case someone's admin role was
  // revoked mid-session.
  async function loadTeamRoster(){
    try {
      var res = await fetch('/api/mytasks/admin/roster', {
        headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin'
      });
      if (res.status === 403) {
        state.teamRoster = []; state.teamTasks = [];
        showError(t('errTeamForbidden'));
      } else if (!res.ok) {
        var body = {}; try { body = await res.json(); } catch (e) {}
        throw new Error(body.error || ('HTTP ' + res.status));
      } else {
        var data = await res.json();
        state.teamRoster = data.users || [];
        showError(null);
      }
    } catch (e) {
      showError(t('errLoad') + ': ' + e.message);
    }
    render();
  }

  // Fetches the currently-selected dropdown choice: one person's open tasks
  // (GET /admin/user/:id — the normal, cheap case) or, for the dropdown's
  // explicit "everyone" option, the full firm-wide list (GET /admin/all —
  // the one case that still loads every user's tasks, now opt-in instead of
  // automatic). teamReqSeq guards against a slow response landing after the
  // admin has already picked someone else — only the latest request is
  // allowed to update state.
  var teamReqSeq = 0;
  async function loadTeamSelection(personId){
    var mySeq = ++teamReqSeq;
    state.teamLoading = true;
    render();
    try {
      var path = personId === 'all'
        ? '/api/mytasks/admin/all'
        : '/api/mytasks/admin/user/' + encodeURIComponent(personId);
      var res = await fetch(path, {
        headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin'
      });
      if (res.status === 403) {
        if (mySeq !== teamReqSeq) return;
        state.teamTasks = [];
        showError(t('errTeamForbidden'));
        return;
      }
      if (!res.ok) {
        var body = {}; try { body = await res.json(); } catch (e) {}
        throw new Error(body.error || ('HTTP ' + res.status));
      }
      var data = await res.json();
      if (mySeq !== teamReqSeq) return; // superseded by a newer selection — drop this stale reply
      var tasks = data.tasks || [];
      if (personId !== 'all') {
        // GET /admin/user/:id returns bare task rows (it's already scoped
        // to one person server-side) — stitch the name/email on from the
        // roster we already have, so taskCard()'s team-mode `.who` tag
        // keeps working unchanged.
        var person = state.teamRoster.filter(function(u){ return u.id === personId; })[0];
        tasks = tasks.map(function(x){
          return Object.assign({}, x, { user_name: person && person.name, user_email: person && person.email });
        });
      }
      state.teamTasks = tasks;
      showError(null);
      document.getElementById('updatedAt').textContent = t('agoJust');
    } catch (e) {
      if (mySeq !== teamReqSeq) return;
      showError(t('errLoad') + ': ' + e.message);
    } finally {
      if (mySeq === teamReqSeq) state.teamLoading = false;
      render();
    }
  }

  function renderSummary(list){
    var urgent = list.filter(function(x){ return x.effective_priority === 'urgent'; });
    var totalMin = list.reduce(function(a,x){ return a + (x.estimated_minutes||0); }, 0);
    var html =
      stat(list.length, t('statOpen')) +
      stat(urgent.length, t('statUrgent'), true) +
      stat(totalMin + ' ' + t('min'), state.mode === 'team' ? t('statTimeTeam') : t('statTime'));
    // "Done today" only means anything for the signed-in user's own tasks —
    // the team view never fetches other people's done tasks.
    if (state.mode === 'mine') html += stat(state.done.length, t('statDone'));
    document.getElementById('summaryRow').innerHTML = html;
    function stat(n,label,isUrgent){
      return '<div class="stat'+(isUrgent?' is-urgent':'')+'"><div class="stat-num">'+n+'</div><div class="stat-label">'+label+'</div></div>';
    }
  }

  // 6 Oct: Clients / Office / Other — who the task is with. Decided by the
  // server without AI (deal link, the people on the email, the source).
  function categoryOf(task){
    if (task.deal_id || (Array.isArray(task.deal_candidates) && task.deal_candidates.length > 1)) return 'client';
    if (task.party === 'client' || task.party === 'office') return task.party;
    if (task.party === 'other' || task.party === 'unknown') return 'other';
    if (task.source === 'whatsapp') return 'client';
    if (task.source === 'manual') return 'office';
    if (/^sys:/.test(String(task.source_ref || ''))) return 'client';
    return 'other';
  }
  function matchesTab(task){ return state.tab === 'all' || categoryOf(task) === state.tab; }
  function renderTabs(list){
    var counts = { all: list.length, client:0, office:0, other:0 };
    list.forEach(function(x){ counts[categoryOf(x)]++; });
    var defs = [['all',t('tabAll')],['client',t('tabClient')],['office',t('tabOffice')],['other',t('tabOther')]];
    var el = document.getElementById('tabs');
    el.innerHTML = defs.map(function(d){
      return '<button class="tab'+(state.tab===d[0]?' is-active':'')+'" role="tab" aria-selected="'+(state.tab===d[0])+'" data-tab="'+d[0]+'" type="button">'+
        d[1]+'<span class="n">'+counts[d[0]]+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.tab'), function(btn){
      btn.addEventListener('click', function(){
        state.tab = btn.getAttribute('data-tab');
        try { localStorage.setItem('mytasks.tab', state.tab); } catch (e) {}
        render();
      });
    });
  }

  function renderFilters(list){
    var counts = { all:0, urgent:0, email:0, whatsapp:0, manual:0 };
    list.forEach(function(x){
      counts.all++; counts[x.source] = (counts[x.source]||0)+1;
      if (x.effective_priority === 'urgent') counts.urgent++;
    });
    var defs = [['all',t('filterAll')],['urgent',t('filterUrgent')],['email',t('filterEmail')],
      ['whatsapp',t('filterWhatsapp')],['manual',t('filterManual')]];
    var el = document.getElementById('filters');
    el.innerHTML = defs.map(function(d){
      return '<button class="chip'+(state.filter===d[0]?' is-active':'')+'" data-filter="'+d[0]+'" type="button">'+
        d[1]+' <span class="n">'+(counts[d[0]]||0)+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(btn){
      btn.addEventListener('click', function(){ state.filter = btn.getAttribute('data-filter'); render(); });
    });
  }

  // Team mode only: a dropdown built from the cheap roster (id/name/email/
  // openCount) instead of chips derived from an already-loaded full task
  // list — nothing about any person's actual tasks is fetched until they're
  // picked here. Staff with zero open tasks still get an option (0), so the
  // roster itself is visible, not just who currently has something open.
  function renderPeople(){
    var el = document.getElementById('people');
    if (state.mode !== 'team') { el.hidden = true; return; }
    el.hidden = false;

    var select = document.getElementById('personSelect');
    var opts = '<option value="">'+t('selectPersonPlaceholder')+'</option>'+
      '<option value="all">'+t('allPeople')+'</option>'+
      state.teamRoster.map(function(u){
        return '<option value="'+escapeAttr(u.id)+'">'+escapeHtml(u.name || u.email)+' ('+u.openCount+')</option>';
      }).join('');
    if (select.innerHTML !== opts) select.innerHTML = opts;
    select.value = state.personFilter;
    select.disabled = !!(state.teamLoading || state.teamRosterLoading);
    select.onchange = function(){
      state.personFilter = select.value;
      state.teamTasks = [];
      if (state.personFilter) loadTeamSelection(state.personFilter); else render();
    };

    document.getElementById('personSelectStatus').textContent = state.teamLoading ? t('loading') : '';
  }

  function matchesFilter(task){
    if (state.filter === 'all') return true;
    if (state.filter === 'urgent') return task.effective_priority === 'urgent';
    return task.source === state.filter;
  }

  function matchesSearch(task){
    var q = state.search.trim().toLowerCase();
    if (!q) return true;
    return (task.title || '').toLowerCase().indexOf(q) !== -1 ||
      (task.summary || '').toLowerCase().indexOf(q) !== -1 ||
      (task.deal_name || '').toLowerCase().indexOf(q) !== -1 ||
      (task.source_name || '').toLowerCase().indexOf(q) !== -1 ||
      (Array.isArray(task.extra_deals) ? task.extra_deals : []).some(function(d){ return String(d.name || '').toLowerCase().indexOf(q) !== -1; });
  }

  // Where the card's "open" button (email/WhatsApp icon) should point.
  // Prefers the link the server already computed and stored (lib/task-hub.js
  // — mail.google.com deep link for email, wa.me / group invite link for
  // WhatsApp). Falls back to deriving it from source_ref client-side for
  // rows created before that column existed, so old tasks don't need a
  // refresh to become clickable.
  function sourceLink(task){
    if (task.link) return task.link;
    if (!task.source_ref) return null;
    if (task.source === 'email') return 'https://mail.google.com/mail/u/0/#all/' + encodeURIComponent(task.source_ref);
    if (task.source === 'whatsapp' && !/@g\.us$/.test(task.source_ref)) {
      var digits = String(task.source_ref).split('@')[0].split(':')[0].replace(/\D/g, '');
      if (digits.length >= 9) return 'https://wa.me/972' + digits.slice(-9);
    }
    return null; // WhatsApp group chats with no known invite link — nothing to open
  }

  // 2026-10-05 (deal linking): the monday deal this task belongs to, as a
  // small link on the card. Only shown when the server linked it for sure.
  function dealChip(task){
    var out = '';
    if (task.deal_id && task.deal_board) {
      // 6 Oct: a task can have several deals — the main one plus any added.
      var all = [{ id: task.deal_id, board: task.deal_board, name: task.deal_name }]
        .concat(Array.isArray(task.extra_deals) ? task.extra_deals : []);
      all.forEach(function(d){
        var href = 'https://epstein-law-firm.monday.com/boards/' + encodeURIComponent(d.board) + '/pulses/' + encodeURIComponent(d.id);
        out += '<span class="deal-wrap"><a class="deal" href="'+escapeAttr(href)+'" target="_blank" rel="noopener noreferrer" title="'+t('openDeal')+'">'+escapeHtml(d.name || 'monday')+'</a>'+
          '<button type="button" class="deal-x" data-remove-deal="'+escapeAttr(String(d.id))+'" data-id="'+task.id+'" title="'+escapeAttr(t('removeDeal'))+'">×</button></span>';
      });
      out += '<button type="button" class="linkbtn" data-open-box="deal" data-id="'+task.id+'">'+escapeHtml(t('addDeal'))+'</button>';
    } else if (Array.isArray(task.deal_candidates) && task.deal_candidates.length > 1) {
      // 6 Oct: the client has several deals and nothing said which.
      var opts = '<option value="">'+escapeHtml(t('chooseDeal'))+'</option>' +
        task.deal_candidates.map(function(d){ return '<option value="'+escapeAttr(String(d.id))+'">'+escapeHtml(d.name || d.id)+'</option>'; }).join('') +
        '<option value="__search">'+escapeHtml(t('searchOtherDeal'))+'</option>' +
        '<option value="__none">'+escapeHtml(t('noneOfThese'))+'</option>';
      out += '<select class="deal-pick" data-deal-pick="'+task.id+'" title="'+escapeAttr(t('chooseDeal'))+'">'+opts+'</select>';
    } else {
      out += '<button type="button" class="linkbtn" data-open-box="deal" data-id="'+task.id+'">'+escapeHtml(t('linkDeal'))+'</button>';
    }
    // 6 Oct: a WhatsApp group with no link — paste it here once.
    if (task.source === 'whatsapp' && /@g\.us$/.test(String(task.source_ref || '')) && !task.link) {
      out += '<button type="button" class="linkbtn" data-open-box="group" data-id="'+task.id+'">'+escapeHtml(t('addGroupLink'))+'</button>';
    }
    var box = state.linkBox;
    if (box && String(box.id) === String(task.id)) {
      out += '<div class="linkbox" data-box="'+task.id+'">'+
        '<div class="linkbox-row"><input type="text" data-box-input="'+box.kind+'" value="'+escapeAttr(box.q || '')+'" placeholder="'+escapeAttr(t(box.kind === 'deal' ? 'dealSearchPh' : 'groupLinkPh'))+'"/>'+
        (box.kind === 'group' ? '<button class="btn" type="button" data-box-save="'+task.id+'">'+t('save')+'</button>' : '')+
        '<button class="btn" type="button" data-box-close="'+task.id+'">'+t('cancel')+'</button></div>'+
        '<div class="lb-results" data-box-results="'+task.id+'">'+linkBoxResultsHtml(box)+'</div>'+
      '</div>';
    }
    return out;
  }

  function linkBoxResultsHtml(box){
    if (box.kind !== 'deal') return box.msg ? '<span class="lb-msg">'+escapeHtml(box.msg)+'</span>' : '';
    if (box.loading) return '<span class="lb-msg">'+t('searching')+'</span>';
    if (box.msg) return '<span class="lb-msg">'+escapeHtml(box.msg)+'</span>';
    if (!box.results) return '';
    if (!box.results.length) return '<span class="lb-msg">'+t('noDealsFound')+'</span>';
    return box.results.map(function(d){
      return '<button type="button" class="lb-item" data-pick-deal="'+escapeAttr(String(d.id))+'">'+escapeHtml(d.name || d.id)+'</button>';
    }).join('');
  }

  // Who it's from: the sender for email, the group / chat for WhatsApp.
  function closedWhy(x){
    var r = x.closed_reason;
    var label = r === 'by_hand' ? t('closedByHand') : r === 'replied' ? t('closedReplied') : r === 'sent_email' ? t('closedSent') : r === 'sent_whatsapp' ? t('closedSentWa') :
      r === 'monday' ? t('closedMonday') : '';
    if (!label) return '';
    return x.closed_note && r !== 'by_hand' ? label + ' — ' + x.closed_note : label;
  }

  function sourceNameHtml(task){
    var isSys = /^sys:/.test(String(task.source_ref || ''));
    var name = task.source_name;
    if (!name && task.source === 'email' && isSys) name = t('autoReminder');
    if (!name) return '';
    var label = (task.source === 'email' && !isSys) ? t('from') + ' ' + name : name;
    return '<span class="src-name" title="'+escapeAttr(label)+'">'+escapeHtml(label)+'</span>';
  }

  function taskCard(task){
    var eff = task.effective_priority;
    var ratio = ageRatio(task);
    var ageCls = ratio >= 1 ? 'is-hot' : (ratio >= 0.6 ? 'is-warm' : '');
    var srcLabel = t('src'+cap(task.source));
    var openHref = task.source !== 'manual' ? sourceLink(task) : null;
    var linkBtn = openHref
      ? '<a class="iconbtn" href="'+escapeAttr(openHref)+'" target="_blank" rel="noopener noreferrer" title="'+t('openSource')+'">'+LINK+'</a>' : '';

    // 2026-09-16 (Shira): "the task, and then a show-more that opens the
    // rest of the necessary details" — the card itself (title, priority,
    // time estimate, age) stays a compact one-liner; the fuller summary
    // (now 2-4 real sentences per the same-day compose-style rewrite, not a
    // fragment) is collapsed by default behind this toggle. Collapsed is
    // the default for a task not in state.expandedTasks.
    var expanded = !!state.expandedTasks[task.id];
    var moreToggle = task.summary
      ? '<button type="button" class="task-more" data-more="'+task.id+'" aria-expanded="'+(expanded?'true':'false')+'">'+
          CHEV+(expanded ? t('showLess') : t('showMore'))+
        '</button>'
      : '';
    var summaryBlock = task.summary
      ? '<div class="task-summary"'+(expanded ? '' : ' hidden')+'>'+summaryLinesHtml(task.summary)+'</div>'
      : '';

    var pillMenu = ['urgent','high','normal','low'].map(function(p){
      return '<button data-set-priority="'+p+'" data-id="'+task.id+'"><span class="dot" data-p="'+p+'"></span>'+t('p'+cap(p))+'</button>';
    }).join('');

    // Team mode: a view into someone else's tasks — the admin can edit the
    // title/estimate and change priority exactly like the task's own owner
    // (same editrow + priority pmenu markup as the 'mine' card below, wired
    // through PATCH /admin/:id in wireList()), with a name tag so it's clear
    // whose task each card is. The one thing deliberately missing is the
    // .task-check checkbox — there is no way for an admin to mark someone
    // else's task done, by design (no [data-toggle] element is ever
    // rendered here, and there is no admin toggle endpoint to call anyway).
    if (state.mode === 'team') {
      var whoTag = '<span class="who">'+escapeHtml(task.user_name || task.user_email || '')+'</span>';
      return (
        '<article class="task is-readonly" data-id="'+task.id+'" data-eff="'+eff+'">'+
          '<div class="task-main">'+
            '<div class="task-toprow">'+whoTag+'<span class="src'+(task.source==='manual'?' is-lawly':'')+'">'+ICONS[task.source]+srcLabel+'</span>'+sourceNameHtml(task)+'</div>'+
            '<div class="task-view" data-view="'+task.id+'">'+
              '<p class="task-title">'+escapeHtml(task.title)+'</p>'+
              moreToggle+summaryBlock+
            '</div>'+
            '<div class="task-editrow" data-edit="'+task.id+'" hidden>'+
              '<input type="text" data-field="title" value="'+escapeAttr(task.title)+'"/>'+
              '<input type="number" data-field="est" value="'+(task.estimated_minutes||15)+'" min="1" max="240"/>'+
              '<button class="btn" data-save="'+task.id+'" type="button">'+t('save')+'</button>'+
              '<button class="btn" data-cancel="'+task.id+'" type="button">'+t('cancel')+'</button>'+
            '</div>'+
            '<div class="task-metarow">'+
              '<div class="pmenu" data-menu="'+task.id+'">'+
                '<button class="pill" data-p="'+eff+'" data-open-menu="'+task.id+'" type="button">'+
                  (task.escalated ? '<span class="esc" title="'+t('escalated')+'">'+UP+'</span>' : '')+
                  t('p'+cap(eff))+
                '</button>'+
                '<div class="pmenu-list">'+pillMenu+'</div>'+
              '</div>'+
              '<span class="est">'+TIMER+' '+(task.estimated_minutes||'—')+' '+t('min')+'</span>'+
              '<span class="age '+ageCls+'">'+CLOCK+' '+ageLabel(task.first_seen_at)+'</span>'+dealChip(task)+
            '</div>'+
          '</div>'+
          '<div class="task-actions">'+
            '<button class="iconbtn" data-editbtn="'+task.id+'" title="'+t('edit')+'">'+PENCIL+'</button>'+
            linkBtn+
          '</div>'+
        '</article>'
      );
    }

    return (
      '<article class="task" data-id="'+task.id+'" data-eff="'+eff+'">'+
        '<button class="task-check" data-toggle="'+task.id+'" aria-label="toggle"></button>'+
        '<div class="task-main">'+
          '<div class="task-toprow"><span class="src'+(task.source==='manual'?' is-lawly':'')+'">'+ICONS[task.source]+srcLabel+'</span>'+sourceNameHtml(task)+'</div>'+
          '<div class="task-view" data-view="'+task.id+'">'+
            '<p class="task-title">'+escapeHtml(task.title)+'</p>'+
            moreToggle+summaryBlock+
          '</div>'+
          '<div class="task-editrow" data-edit="'+task.id+'" hidden>'+
            '<input type="text" data-field="title" value="'+escapeAttr(task.title)+'"/>'+
            '<input type="number" data-field="est" value="'+(task.estimated_minutes||15)+'" min="1" max="240"/>'+
            '<button class="btn" data-save="'+task.id+'" type="button">'+t('save')+'</button>'+
            '<button class="btn" data-cancel="'+task.id+'" type="button">'+t('cancel')+'</button>'+
          '</div>'+
          '<div class="task-metarow">'+
            '<div class="pmenu" data-menu="'+task.id+'">'+
              '<button class="pill" data-p="'+eff+'" data-open-menu="'+task.id+'" type="button">'+
                (task.escalated ? '<span class="esc" title="'+t('escalated')+'">'+UP+'</span>' : '')+
                t('p'+cap(eff))+
              '</button>'+
              '<div class="pmenu-list">'+pillMenu+'</div>'+
            '</div>'+
            '<span class="est">'+TIMER+' '+(task.estimated_minutes||'—')+' '+t('min')+'</span>'+
            '<span class="age '+ageCls+'">'+CLOCK+' '+ageLabel(task.first_seen_at)+'</span>'+dealChip(task)+
          '</div>'+
        '</div>'+
        '<div class="task-actions">'+
          '<button class="iconbtn" data-editbtn="'+task.id+'" title="'+t('edit')+'">'+PENCIL+'</button>'+
          linkBtn+
        '</div>'+
      '</article>'
    );
  }

  function render(){
    document.documentElement.lang = state.lang === 'he' ? 'he' : 'en';
    document.documentElement.dir = state.lang === 'he' ? 'rtl' : 'ltr';
    document.getElementById('langToggle').textContent = state.lang === 'he' ? 'EN' : 'עב';
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.getElementById('teamToggleLabel').textContent =
      state.mode === 'team' ? (state.teamRosterLoading ? t('loading') : t('myTasksView')) : t('teamView');
    var teamToggleBtn = document.getElementById('teamToggleBtn');
    teamToggleBtn.classList.toggle('is-loading', !!state.teamRosterLoading);
    teamToggleBtn.disabled = !!state.teamRosterLoading;

    // Which dataset is on screen: the signed-in user's own tasks, or (admins
    // only) whichever person/everyone was picked from the Team view dropdown
    // — same page, same rendering below, just a different source list.
    // state.teamTasks already comes back scoped from the server (one
    // person's tasks, or everyone's for the dropdown's "all" choice), so no
    // extra client-side filtering is needed here.
    var scoped = state.mode === 'team' ? state.teamTasks : state.tasks;

    document.getElementById('composer').hidden = state.mode === 'team';
    renderPeople();
    renderSummary(scoped);
    renderTabs(scoped);
    var tabbed = scoped.filter(matchesTab);
    renderFilters(tabbed);

    var searchInput = document.getElementById('searchInput');
    searchInput.placeholder = t('search');
    document.getElementById('searchClear').hidden = !state.search;
    document.getElementById('composerInput').placeholder = t('addPlaceholder');

    var visible = tabbed.filter(matchesFilter).filter(matchesSearch);
    var groups = { urgent:[], high:[], later:[] };
    visible.forEach(function(x){
      if (x.effective_priority === 'urgent') groups.urgent.push(x);
      else if (x.effective_priority === 'high') groups.high.push(x);
      else groups.later.push(x);
    });

    var html = '';
    if (!visible.length) {
      if (state.mode === 'team' && !state.personFilter) {
        html = '<p class="empty">'+t('selectPersonPrompt')+'</p>';
      } else {
        html = '<p class="empty">'+(state.search.trim() ? t('noResults') : t('empty'))+'</p>';
      }
    } else {
      if (groups.urgent.length) html += groupHtml('urgent', t('groupUrgent'), groups.urgent);
      if (groups.high.length) html += groupHtml('high', t('groupHigh'), groups.high);
      if (groups.later.length) html += groupHtml('later', t('groupLater'), groups.later);
    }
    // "Done today" is the signed-in user's own completed tasks — the team
    // view never fetches anyone else's done tasks, so this stays mine-only.
    if (state.mode === 'mine' && state.done.length) {
      html += '<button class="done-toggle'+(state.doneOpen?' is-open':'')+'" id="doneToggle" type="button">'+CHEV+' '+t('doneList')+' ('+state.done.length+')</button>';
      if (state.doneOpen) {
        html += '<div class="card-stack" style="margin-top:9px;">' + state.done.map(function(x){
          // 6 Oct: why it closed (you / a reply / an email sent / monday) and a
          // way to reopen it — a reopened task is never closed automatically again.
          var why = closedWhy(x);
          return '<article class="task is-done" data-eff="'+x.priority+'"><button class="task-check" disabled></button>'+
            '<div class="task-main"><div class="task-toprow"><span class="src">'+ICONS[x.source]+t('src'+cap(x.source))+'</span>'+sourceNameHtml(x)+'</div>'+
            '<p class="task-title">'+escapeHtml(x.title)+'</p>'+
            (why ? '<p class="closed-why">'+escapeHtml(why)+'</p>' : '')+
            '</div><div class="task-actions"><button class="btn reopen" type="button" data-toggle="'+x.id+'">'+t('reopen')+'</button></div></article>';
        }).join('') + '</div>';
      }
    }

    document.getElementById('taskList').innerHTML = html;
    wireList();

    function groupHtml(key, label, items){
      var open = !state.collapsed[key];
      return '<div class="group">'+
        '<button type="button" class="group-head'+(key==='urgent'?' is-urgent':'')+(open?' is-open':'')+
          '" data-grouptoggle="'+key+'" aria-expanded="'+open+'">'+
          '<span class="grp-chev">'+CHEV+'</span><h2>'+label+'</h2><span class="count">'+items.length+'</span>'+
        '</button>'+
        (open ? ('<div class="card-stack">'+items.map(taskCard).join('')+'</div>') : '')+
      '</div>';
    }
  }

  function wireList(){
    var list = document.getElementById('taskList');
    // 6 Oct: link to a deal / save a group link — works in Team view too (admin).
    function taskPath(id, what){ return (state.mode === 'team' ? '/admin/' : '/') + id + '/' + what; }
    async function reloadAfterLink(){
      state.linkBox = null;
      if (state.mode === 'team') { if (state.personFilter) await loadTeamSelection(state.personFilter); else render(); }
      else await loadTasks();
    }
    async function postDeal(id, dealId, extra){
      await api(taskPath(id, 'deal'), { method:'POST', body: JSON.stringify(Object.assign({ deal_id: dealId }, extra || {})) });
      await reloadAfterLink();
    }
    Array.prototype.forEach.call(list.querySelectorAll('[data-remove-deal]'), function(btn){
      btn.addEventListener('click', async function(){
        btn.disabled = true;
        try { await postDeal(btn.getAttribute('data-id'), btn.getAttribute('data-remove-deal'), { remove: true }); }
        catch (e) { showError(e.message); btn.disabled = false; }
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-deal-pick]'), function(sel){
      sel.addEventListener('change', async function(){
        var id = sel.getAttribute('data-deal-pick');
        var v = sel.value;
        if (!v) return;
        if (v === '__search') { state.linkBox = { id: id, kind: 'deal', q: '' }; render(); return; }
        sel.disabled = true;
        try { await postDeal(id, v === '__none' ? null : v); }
        catch (e) { showError(e.message); sel.disabled = false; }
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-open-box]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id'), kind = btn.getAttribute('data-open-box');
        state.linkBox = (state.linkBox && String(state.linkBox.id) === id && state.linkBox.kind === kind) ? null : { id: id, kind: kind, q: '' };
        render();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-box-close]'), function(btn){
      btn.addEventListener('click', function(){ state.linkBox = null; render(); });
    });
    var boxInput = list.querySelector('[data-box-input]');
    if (boxInput && state.linkBox) {
      var box = state.linkBox;
      var resultsEl = list.querySelector('[data-box-results]');
      var wirePicks = function(){
        Array.prototype.forEach.call(list.querySelectorAll('[data-pick-deal]'), function(b){
          b.onclick = async function(){
            b.disabled = true;
            try { await postDeal(box.id, b.getAttribute('data-pick-deal'), { add: true }); }
            catch (e) { box.msg = e.message; paint(); }
          };
        });
      };
      var paint = function(){ if (resultsEl) resultsEl.innerHTML = linkBoxResultsHtml(box); wirePicks(); };
      wirePicks();
      boxInput.focus();
      try { boxInput.setSelectionRange(boxInput.value.length, boxInput.value.length); } catch (e) {}
      var saveGroup = async function(){
        box.msg = '';
        try {
          await api(taskPath(box.id, 'group-link'), { method:'POST', body: JSON.stringify({ link: boxInput.value }) });
          await reloadAfterLink();
        } catch (e) { box.msg = e.message; paint(); }
      };
      boxInput.addEventListener('input', function(){
        box.q = boxInput.value; box.msg = '';
        if (box.kind !== 'deal') return;
        clearTimeout(box.timer);
        var q = box.q.trim();
        if (q.length < 2) { box.results = null; box.loading = false; paint(); return; }
        box.loading = true; paint();
        box.timer = setTimeout(async function(){
          try {
            var r = await api('/deals/search?q=' + encodeURIComponent(q));
            if (state.linkBox !== box || box.q.trim() !== q) return;
            box.results = r.deals || []; box.loading = false; paint();
          } catch (e) { box.loading = false; box.msg = e.message; paint(); }
        }, 350);
      });
      boxInput.addEventListener('keydown', function(ev){
        if (ev.key === 'Escape') { state.linkBox = null; render(); }
        if (ev.key === 'Enter' && box.kind === 'group') saveGroup();
      });
      var saveBtn = list.querySelector('[data-box-save]');
      if (saveBtn) saveBtn.addEventListener('click', saveGroup);
    }
    Array.prototype.forEach.call(list.querySelectorAll('[data-toggle]'), function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-toggle');
        try { await api('/'+id+'/toggle', { method:'POST' }); await loadTasks(); }
        catch (e) { showError(e.message); }
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-editbtn]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-editbtn');
        list.querySelector('[data-view="'+id+'"]').hidden = true;
        list.querySelector('[data-edit="'+id+'"]').hidden = false;
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-cancel]'), function(btn){
      btn.addEventListener('click', function(){ render(); });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-save]'), function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-save');
        var row = list.querySelector('[data-edit="'+id+'"]');
        var title = row.querySelector('[data-field="title"]').value.trim();
        var est = parseInt(row.querySelector('[data-field="est"]').value, 10);
        // Team mode edits someone else's task — goes through the admin-only
        // PATCH /admin/:id endpoint instead of the owner-scoped PATCH /:id,
        // and reloads from the team dataset afterward.
        var path = state.mode === 'team' ? '/admin/'+id : '/'+id;
        try {
          await api(path, { method:'PATCH', body: JSON.stringify({ title: title, estimated_minutes: est }) });
          if (state.mode === 'team') { if (state.personFilter) await loadTeamSelection(state.personFilter); }
          else await loadTasks();
        } catch (e) { showError(e.message); }
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-open-menu]'), function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var wrap = btn.closest('.pmenu');
        var wasOpen = wrap.classList.contains('is-open');
        Array.prototype.forEach.call(list.querySelectorAll('.pmenu.is-open'), function(m){ m.classList.remove('is-open'); });
        if (!wasOpen) wrap.classList.add('is-open');
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-set-priority]'), function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-id');
        var p = btn.getAttribute('data-set-priority');
        var path = state.mode === 'team' ? '/admin/'+id : '/'+id;
        try {
          await api(path, { method:'PATCH', body: JSON.stringify({ priority: p }) });
          if (state.mode === 'team') { if (state.personFilter) await loadTeamSelection(state.personFilter); }
          else await loadTasks();
        }
        catch (e) { showError(e.message); }
      });
    });
    var doneToggle = document.getElementById('doneToggle');
    if (doneToggle) doneToggle.addEventListener('click', function(){ state.doneOpen = !state.doneOpen; render(); });

    Array.prototype.forEach.call(list.querySelectorAll('[data-more]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-more');
        state.expandedTasks[id] = !state.expandedTasks[id];
        render();
      });
    });
    Array.prototype.forEach.call(list.querySelectorAll('[data-grouptoggle]'), function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-grouptoggle');
        state.collapsed[key] = !state.collapsed[key];
        render();
      });
    });
  }

  document.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.pmenu.is-open'), function(m){ m.classList.remove('is-open'); });
  });

  document.getElementById('langToggle').addEventListener('click', function(){
    state.lang = state.lang === 'he' ? 'en' : 'he';
    try { localStorage.setItem('mytasks-lang', state.lang); } catch (e) {}
    render();
  });

  document.getElementById('searchInput').addEventListener('input', function(){
    // render() rebuilds #summaryRow/#filters/#taskList but never touches
    // #searchInput itself, so the field keeps focus and cursor position
    // across every keystroke without needing to be refocused.
    state.search = this.value;
    render();
  });
  document.getElementById('searchClear').addEventListener('click', function(){
    state.search = '';
    var input = document.getElementById('searchInput');
    input.value = '';
    render();
    input.focus();
  });

  // "Add my own task" composer — posts straight to the existing
  // POST /api/mytasks/chat endpoint (taskHub.addManualTask), the same
  // manual-task-extract skill that already turns free text sent to LAWLY
  // on WhatsApp into a task. This just gives that same channel a box on
  // the page itself, instead of requiring a WhatsApp message.
  var composerInput = document.getElementById('composerInput');
  var composerBtn = document.getElementById('composerBtn');

  async function submitManualTask(){
    var text = composerInput.value.trim();
    if (!text) return;
    composerBtn.disabled = true;
    composerBtn.classList.add('is-loading');
    composerBtn.querySelector('span').textContent = t('adding');
    try {
      await api('/chat', { method:'POST', body: JSON.stringify({ text: text }) });
      composerInput.value = '';
      showError(null);
      await loadTasks();
    } catch (e) {
      showError(t('errAdd') + ': ' + e.message);
    } finally {
      composerBtn.disabled = false;
      composerBtn.classList.remove('is-loading');
      composerBtn.querySelector('span').textContent = t('addTask');
    }
  }

  composerBtn.addEventListener('click', submitManualTask);
  composerInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); submitManualTask(); }
  });

  // 2026-09-17 (Shira): REVERSES the 2026-09-15 "auto-refresh, no click
  // needed" decision above this comment used to describe — AI-credit cost
  // control. POST /refresh is what triggers the actual Claude triage calls
  // (via taskHub.refreshTasks()), so it must now only fire when the person
  // explicitly clicks the Refresh button below. No call on page load, no
  // background poll. Loading the page still shows whatever's already been
  // triaged (loadTasks() below is a plain DB read, free). If this needs to
  // come back later, the old function was `backgroundRefresh()`: POST
  // /refresh then loadTasks(), called once on load and every 45s on a
  // setInterval, 'mine' mode only — see git history.
  //
  // NOTE: this page-level change is NOT the whole picture — lib/scheduler.js
  // also runs the exact same refreshTasks() for every active user on its own
  // server-side timer (TASK_HUB_AUTO_REFRESH_SECONDS, default 5 min),
  // independent of whether anyone has this page open at all. That's now
  // gated off by default too (see lib/scheduler.js), otherwise this change
  // alone would not actually stop the automatic AI spend.

  document.getElementById('refreshBtn').addEventListener('click', async function(){
    var btn = this;
    btn.classList.add('is-loading');
    btn.querySelector('span').textContent = t('refreshing');
    try {
      if (state.mode === 'team') {
        // No per-person "pull from email/WhatsApp/monday" equivalent for
        // the whole team (that's what /refresh does for one signed-in
        // user) — refreshing here just re-reads the current DB state for
        // whatever's currently selected (roster if nothing's picked yet,
        // otherwise that person's — or everyone's — tasks).
        if (state.personFilter) await loadTeamSelection(state.personFilter);
        else await loadTeamRoster();
      } else {
        await api('/refresh', { method:'POST' });
        await loadTasks();
      }
    } catch (e) {
      showError(t('errRefresh') + ': ' + e.message);
    } finally {
      btn.classList.remove('is-loading');
      btn.querySelector('span').textContent = t('refresh');
    }
  });

  // Team/mine toggle — same page, just swaps the data source and, in team
  // mode, hides the composer (adding a task while looking at someone else's
  // list would be confusing) and shows the person dropdown instead. Entering
  // team mode only loads the cheap roster (counts, not tasks) — nothing
  // about anyone's actual tasks loads until a person is picked from the
  // dropdown. The button disables itself and shows a loading label for the
  // one moment that takes, specifically so a slow connection can't be
  // mistaken for "the click didn't register" and mashed repeatedly.
  document.getElementById('teamToggleBtn').addEventListener('click', async function(){
    if (state.teamRosterLoading) return;
    state.mode = state.mode === 'mine' ? 'team' : 'mine';
    if (state.mode !== 'team') { render(); return; }
    state.personFilter = '';
    state.teamTasks = [];
    state.teamRosterLoading = true;
    render();
    await loadTeamRoster();
    state.teamRosterLoading = false;
    render();
  });

  // Reveal the "Team view" toggle only for admins — GET /api/mytasks/admin/all
  // is already gated server-side (requireAdmin); this just keeps non-admins
  // from seeing a button that would 403 on them.
  fetch('/api/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (me) { if (me && me.isAdmin) document.getElementById('teamToggleBtn').hidden = false; })
    .catch(function () { /* non-fatal — button just stays hidden */ });

  try { var savedTab = localStorage.getItem('mytasks.tab'); if (['all','client','office','other'].indexOf(savedTab) !== -1) state.tab = savedTab; } catch (e) {}
  loadTasks();
  // Team view keeps its own light poll — this only re-reads whatever's
  // already on screen (loadTeamSelection), it does NOT call POST /refresh
  // and does not trigger any AI triage, so it's not part of the cost this
  // page used to add and is left as-is.
  setInterval(function(){
    if (state.mode === 'team' && state.personFilter) loadTeamSelection(state.personFilter);
  }, 45000);
})();
</script>
</body>
</html>
