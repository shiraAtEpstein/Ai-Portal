<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · Epstein &amp; Co. · LAWLY</title>
<!--
  Settings — redesign Phase 2.
  Design ported 1:1 from the approved Settings-Redesign-Prototype (navy/cream
  portal design system). LIVE wiring: identity (/api/me), memory
  (/api/me/memory + forget), firm-rule proposals (/api/firm-rules/request),
  admin approvals (/api/admin/firm-rules …), People (/api/admin/all-users …),
  Activity (/api/admin/audit), and — new in Phase 2 — profile + notification
  settings (/api/me/settings GET/PUT) with an editable display name.
  All calls use the session cookie (credentials:'include').
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#15161a;--navy-dark:#000;--navy-mid:#2b2c32;--ink:#17181c;
  --cream:#f6f3ec;--cream-active:#ebe5da;
  --white:#fff;--gray-50:#f8f9fa;--gray-100:#f1f3f5;--gray-200:#e9ecef;--gray-300:#dee2e6;--gray-400:#adb5bd;--gray-600:#6c757d;--gray-800:#343a40;
  --muted:#8f897e;--muted-2:#9c968b;
  --red:#dc3545;--green:#1c7a42;--amber:#9a6b00;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:Georgia,'Frank Ruhl Libre','Times New Roman',serif;
}
body{font-family:var(--font);background:var(--gray-100);color:var(--gray-800);height:100vh;overflow:hidden}
.signin{max-width:420px;margin:16vh auto;text-align:center;color:var(--gray-600);background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:40px 32px;font-size:14px;line-height:1.6}
.signin a{color:var(--navy);font-weight:600}
.app{display:flex;height:100vh;width:100vw}

/* nav */
.snav{width:264px;min-width:264px;background:var(--cream);border-right:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;height:100vh}
.snav-head{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.snav-head .title{font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:600;letter-spacing:.3px}
.snav-back{border:none;background:transparent;color:#6b665d;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:8px;text-decoration:none}
.snav-back:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.snav-search{margin:4px 16px 10px;position:relative}
.snav-search input{width:100%;padding:9px 12px 9px 32px;border:1px solid rgba(0,0,0,.12);border-radius:9px;background:#fff;font-size:13px;outline:none;color:var(--ink)}
.snav-search input:focus{border-color:var(--navy)}
.snav-search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.snav-search .ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.snav-list{flex:1;overflow-y:auto;padding:4px 12px 20px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.18) transparent}
.snav-list::-webkit-scrollbar{width:8px}
.snav-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.snav-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted-2);padding:16px 12px 6px}
.snav-admin-note{font-size:11px;color:var(--muted);line-height:1.5;padding:2px 12px 8px}
.snav-item{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;background:transparent;border-radius:9px;color:#3c3d42;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:.13s;margin-bottom:2px;position:relative}
.snav-item:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.snav-item.active{background:var(--cream-active);color:var(--ink);font-weight:600}
.snav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--navy)}
.snav-item .si{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.snav-item .si svg{width:17px;height:17px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.snav-item.active .si{color:var(--navy)}
.snav-item:hover .si{color:var(--ink)}
.snav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.snav-hidden-tag{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--muted);background:rgba(0,0,0,.06);padding:2px 6px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.snav-user{margin:auto 12px 12px;padding:12px 10px 4px;border-top:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:10px}
.snav-user .av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.snav-user b{font-size:13px;color:var(--ink)}.snav-user span{display:block;font-size:11.5px;color:var(--muted)}
[dir="rtl"] .snav-item.active::before{left:auto;right:0;border-radius:3px 0 0 3px}

/* content */
.content{flex:1;overflow-y:auto;background:var(--gray-100)}
.cwrap{max-width:760px;margin:0 auto;padding:34px 40px 90px}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{margin-bottom:22px}
.phead h1{font-size:23px;color:var(--ink);font-weight:700;letter-spacing:.2px}
.phead p{font-size:13.5px;color:var(--gray-600);margin-top:5px;line-height:1.55;max-width:600px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}

.card{background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.card h2{font-size:14.5px;color:var(--ink);font-weight:700;margin-bottom:3px}
.csub{font-size:12.5px;color:var(--gray-600);margin-bottom:16px;line-height:1.5}
.card-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-head-row h2{margin-bottom:2px}.card-head-row .csub{margin-bottom:0}

.field{margin-bottom:16px}.field:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.flabel{display:block;font-size:11.5px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
input.tin,select.tin,textarea.tin{width:100%;padding:10px 13px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:13.5px;font-family:var(--font);outline:none;color:var(--ink);background:#fff;transition:border-color .15s}
input.tin:focus,select.tin:focus,textarea.tin:focus{border-color:var(--navy)}
input.tin:disabled{background:var(--gray-50);color:var(--gray-600)}
textarea.tin{resize:vertical;min-height:80px;line-height:1.55}
.readonly-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-left:8px}
.avatar-row{display:flex;align-items:center;gap:18px}
.avatar-lg{width:74px;height:74px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0}
.avatar-actions{display:flex;gap:8px}

.btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--navy);font-family:var(--font);transition:.15s}
.btn:hover{background:var(--gray-50);border-color:var(--gray-400)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-mid)}
.btn.danger{color:var(--red);border-color:#f5c6cb}.btn.danger:hover{background:#fde8ea}
.btn.sm{padding:7px 13px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--gray-100)}
.btn:disabled{opacity:.55;cursor:default}

.sw{position:relative;width:38px;height:22px;flex-shrink:0;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw .track{position:absolute;inset:0;background:var(--gray-300);border-radius:999px;transition:.2s;cursor:pointer}
.sw .track::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + .track{background:var(--navy)}
.sw input:checked + .track::before{transform:translateX(16px)}

.trow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--gray-100)}
.trow:last-child{border-bottom:none}.trow:first-child{padding-top:0}
.trow .tinfo{flex:1;min-width:0}
.trow .tname{font-size:13.5px;font-weight:600;color:var(--ink)}
.trow .tdesc{font-size:12px;color:var(--gray-600);margin-top:3px;line-height:1.45}
.seg{display:inline-flex;background:var(--gray-100);border-radius:9px;padding:3px;gap:3px}
.seg button{padding:7px 15px;border:none;background:transparent;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--gray-600);cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.badge-st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:capitalize}
.b-active{background:#e7f6ec;color:#1c7a42}.b-pending{background:#fef3d7;color:#9a6b00}.b-off{background:var(--gray-100);color:var(--gray-600)}.b-expired{background:#fde8ea;color:#dc3545}.b-purple{background:#eae7f4;color:#6b52a8}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.dot.g{background:#28a745}.dot.r{background:#dc3545}

.conn{display:flex;align-items:flex-start;gap:14px;padding:18px 0;border-bottom:1px solid var(--gray-100)}
.conn:last-child{border-bottom:none}.conn:first-child{padding-top:0}
.conn .logo{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--gray-50);border:1px solid var(--gray-200);color:#3c3d42}
.conn .logo svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.conn .cbody{flex:1;min-width:0}
.conn .cname{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.conn .cmeta{font-size:12px;color:var(--gray-600);margin-top:4px;line-height:1.5}
.conn .cperms{font-size:11.5px;color:var(--muted);margin-top:6px}
.conn .cactions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

.mem-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--gray-200)}
.mem-tab{padding:9px 4px;margin-right:16px;border:none;background:transparent;font-size:13.5px;font-weight:600;color:var(--gray-600);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.mem-tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.mem-card{border:1px solid var(--gray-200);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.mem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mem-text{font-size:13.5px;color:var(--ink);line-height:1.5;flex:1}
.mem-meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mem-actions{display:flex;gap:4px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border:1px solid var(--gray-200);background:#fff;border-radius:7px;cursor:pointer;font-size:13px;color:var(--gray-600);display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:var(--gray-50);color:var(--ink)}
.icon-btn.danger:hover{background:#fde8ea;color:#dc3545;border-color:#f5c6cb}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 10px;color:var(--gray-600);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--gray-200);font-weight:700}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .uname{font-weight:600;color:var(--ink)}.tbl .uemail{font-size:12px;color:var(--gray-600)}
.tbl .row-actions{display:flex;gap:4px;flex-wrap:wrap}

.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filterbar input,.filterbar select{padding:8px 11px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:12.5px;outline:none;font-family:var(--font)}
.filterbar input:focus,.filterbar select:focus{border-color:var(--navy)}

.appr{border:1px solid var(--gray-200);border-radius:12px;margin-bottom:14px;overflow:hidden}
.appr-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;background:#fff}
.appr-head:hover{background:var(--gray-50)}
.appr-head .atitle{font-size:14px;font-weight:700;color:var(--ink)}
.appr-head .ameta{font-size:12px;color:var(--gray-600);margin-top:3px}
.appr-body{padding:0 18px 18px;border-top:1px solid var(--gray-100);display:none}
.appr.open .appr-body{display:block}.appr.open .chev{transform:rotate(90deg)}
.chev{transition:.2s;color:var(--gray-400);margin-left:auto}
.diff{border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;margin:14px 0;font-size:13px;line-height:1.6}
.diff .dl{padding:8px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap}
.diff .add{background:#e9f7ee;color:#12683a}.diff .add::before{content:"+ ";opacity:.6}
.src-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--gray-100);color:var(--gray-800)}
.appr-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.secbar{display:flex;gap:12px;align-items:flex-start;background:#fbfaf6;border:1px solid #eadfc4;border-radius:12px;padding:14px 16px;margin-bottom:18px}
.secbar .si{font-size:18px;line-height:1}.secbar .st{font-size:12.5px;color:#6b5d33;line-height:1.55}.secbar .st b{color:#4d431f}
.rule{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--gray-100);font-size:13.5px;color:var(--ink);line-height:1.5}
.rule:last-child{border-bottom:none}.rule .rnum{color:var(--muted);font-weight:700;flex-shrink:0}
.info{display:flex;gap:11px;align-items:flex-start;background:#e6edf6;border:1px solid #cdd9ee;border-radius:10px;padding:13px 15px;font-size:12.5px;color:#2c3f66;line-height:1.55;margin-bottom:16px}
.info .si{line-height:1}
.hidden-banner{display:flex;gap:11px;align-items:center;background:var(--gray-100);border:1px dashed var(--gray-300);border-radius:10px;padding:13px 15px;font-size:12.5px;color:var(--gray-600);margin-bottom:16px}
.empty{text-align:center;padding:40px 20px;color:var(--gray-400)}.empty .ei{font-size:32px;margin-bottom:10px}.empty h3{font-size:15px;color:var(--gray-600);margin-bottom:6px}.empty p{font-size:13px;max-width:340px;margin:0 auto;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--gray-100);border-radius:999px;font-size:12px;color:var(--gray-800);font-weight:500}
.core-tag{display:inline-block;padding:4px 10px;border-radius:7px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.lic{display:flex;gap:16px;flex-wrap:wrap}.lic .lbox{flex:1;min-width:120px;border:1px solid var(--gray-200);border-radius:10px;padding:14px 16px}.lic .lnum{font-size:24px;font-weight:700;color:var(--navy)}.lic .llbl{font-size:11.5px;color:var(--gray-600);margin-top:2px}
.phase-note{font-size:11.5px;color:var(--muted);margin-top:10px;font-style:italic}

.overlay{display:none;position:fixed;inset:0;background:rgba(17,18,26,.5);z-index:100;align-items:flex-start;justify-content:center;padding:70px 20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:500px;max-width:95vw;box-shadow:0 24px 70px rgba(0,0,0,.35);max-height:82vh;overflow-y:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--gray-200)}
.modal-h h3{font-size:16px;color:var(--ink)}.modal-x{border:none;background:transparent;font-size:24px;color:var(--gray-400);cursor:pointer;line-height:1}
.modal-b{padding:22px 24px}.modal-f{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px}

.savebar{position:fixed;bottom:0;left:264px;right:0;background:#fff;border-top:1px solid var(--gray-200);padding:14px 40px;display:none;align-items:center;justify-content:space-between;box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:80}
.savebar.show{display:flex}.savebar .sbmsg{font-size:12.5px;color:var(--gray-600)}.savebar .sbactions{display:flex;gap:10px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.footnote{font-size:11px;color:var(--muted);text-align:center;padding:20px 0 0;line-height:1.6}
[dir="rtl"] .mem-text{direction:rtl}
@media(max-width:720px){.snav{width:210px;min-width:210px}.cwrap{padding:24px 20px 90px}.savebar{left:210px;padding:12px 20px}}
</style>
</head>
<body>

<div id="signin" class="signin" style="display:none"></div>

<div class="app" id="app" style="display:none">
  <nav class="snav">
    <div class="snav-head"><div class="title">Settings</div><a class="snav-back" href="/">← Portal</a></div>
    <div class="snav-search"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></svg></span><input id="nav-search" type="text" placeholder="Search settings…"></div>
    <div class="snav-list" id="nav-list"></div>
    <div class="snav-user"><div class="av" id="who-av">·</div><div><b id="who-name">—</b><span id="who-role"></span></div></div>
  </nav>
  <main class="content"><div class="cwrap" id="pages"></div></main>
</div>

<!-- modals -->
<div class="overlay" id="m-invite"><div class="modal" style="width:460px"><div class="modal-h"><h3>Invite a user</h3><button class="modal-x" data-close>×</button></div><div class="modal-b">
  <div class="field"><label class="flabel">Email</label><input class="tin" id="inv-email" placeholder="name@epsteinlaw.co.il"></div>
  <div class="field"><label class="flabel">Full name</label><input class="tin" id="inv-name" placeholder="Full name"></div>
  <div class="field" style="margin-bottom:0"><label class="flabel">Roles</label><div class="chips" id="inv-roles"></div></div>
  <div class="csub" id="inv-note" style="margin:12px 0 0"></div>
</div><div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn primary" id="inv-send">Send invite</button></div></div></div>

<div class="overlay" id="m-compare"><div class="modal"><div class="modal-h"><h3>Compare versions</h3><button class="modal-x" data-close>×</button></div><div class="modal-b" id="compare-body"></div><div class="modal-f"><button class="btn" data-close>Close</button></div></div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var IC={
    profile:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.2-5.5 7-5.5s7 2 7 5.5"/>',
    bell:'<path d="M6 9a6 6 0 0 1 12 0c0 4.5 1.8 5.6 1.8 5.6H4.2S6 13.5 6 9z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
    lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

  function loadFirmConnections(){

        else if(dbx.connected){ html+=connRow({ic:IC.doc,name:'Dropbox',state:'connected',meta:'Firm account'+(dbx.account?' · '+esc(dbx.account):'')+' · matter files &amp; firm rules (read-only)',actions:'<button class="btn sm danger" data-dbx="disc">Disconnect</button>'}); }
        else { html+=connRow({ic:IC.doc,name:'Dropbox',state:'na',meta:'Connect the firm Dropbox.',actions:'<button class="btn sm primary" data-dbx="conn">Connect</button>'}); }
      } else {
        html+=connRow({ic:IC.doc,name:'Dropbox',state:'firm',meta:'Firm files · managed by an administrator'});
      }
      html+=connRow({ic:IC.activity,name:'monday.com',state:'firm',meta:'Deal boards (read-only) · managed by an administrator'});

  // ── navigation ──

  function putSettings(body,cb){
    fetch('/api/me/settings',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,j:j};}).catch(function(){return {ok:r.ok,status:r.status,j:{}};});})
      .then(cb).catch(function(){toast('Network error — please try again.');});

  function roleChips(roles){return (roles&&roles.length)?roles.map(function(r){return '<span class="chip" style="padding:3px 9px;font-size:11px">'+esc(r)+'</span>';}).join(' '):'<span style="color:var(--gray-400)">none</span>';}
  function renderUsers(users){
    var tb=$('#users-tbody'); var active=0,pending=0;
    if(!users.length){ tb.innerHTML='<tr><td colspan="4" style="color:var(--gray-400)">No users yet.</td></tr>'; }
    else{
      tb.innerHTML=users.map(function(u){

        return '<tr><td><div class="uname">'+(esc(u.name)||'—')+'</div><div class="uemail">'+esc(u.email)+'</div></td><td><div class="chips" style="margin-top:0" data-roles>'+roleChips(u.roles)+'</div></td><td>'+badge+'</td><td class="row-actions">'+actions+'</td></tr>';

  function userAction(act,email,btn){

    if(act==='delete' && !confirm('Permanently delete '+email+'? This cannot be undone.')) return;
    var map={disable:'/api/admin/disable',enable:'/api/admin/enable',delete:'/api/admin/delete-user',resend:'/api/admin/resend-invite'};
    jpost(map[act],{email:email}).then(function(r){ if(!r.ok) throw new Error((r.j&&r.j.error)||'Action failed.'); toast('Done — '+email); loadPeople(); }).catch(function(e){toast(e.message);});

  var auditEvents=[];
  function initAudit(){

  function loadAudit(){
    var tb=$('#aud-tbody'); if(!tb)return;
    jget('/api/admin/audit?limit=500').then(function(r){
      if(r.status===403){ tb.innerHTML='<tr><td colspan="5" style="color:var(--gray-600)">Admins only.</td></tr>'; return; }
      if(!r.ok) throw new Error((r.j&&r.j.error)||'Could not load the history.');
      auditEvents=r.j.events||[];
      var sel=$('#aud-action');var cur=sel.value;var present=[];auditEvents.forEach(function(e){if(present.indexOf(e.action)===-1)present.push(e.action);});
      sel.innerHTML='<option value="">All actions</option>'+present.map(function(a){return '<option value="'+esc(a)+'">'+esc(AUDIT_LABELS[a]||a)+'</option>';}).join('');sel.value=cur;
      renderAudit();
    }).catch(function(e){ tb.innerHTML='<tr><td colspan="5" style="color:#dc3545">'+esc(e.message)+'</td></tr>'; });
  }
  function fmtDetails(meta){ if(!meta||typeof meta!=='object')return ''; var parts=[]; Object.keys(meta).forEach(function(k){ if(k==='actor'||k==='target')return; var v=meta[k]; if(Array.isArray(v))v=v.join(', '); else if(v&&typeof v==='object')v=JSON.stringify(v); parts.push(esc(k)+': '+esc(v)); }); return parts.join(' · '); }
  function filteredAudit(){
    var q=($('#aud-q').value||'').trim().toLowerCase(),act=$('#aud-action').value||'',from=$('#aud-from').value||'',to=$('#aud-to').value||'';
    var fromT=from?new Date(from+'T00:00:00').getTime():null,toT=to?new Date(to+'T23:59:59').getTime():null;
    return auditEvents.filter(function(e){ if(act&&e.action!==act)return false; var t=new Date(e.ts).getTime(); if(fromT&&t<fromT)return false; if(toT&&t>toT)return false; if(q){var hay=((e.actorName||'')+' '+(e.target||'')).toLowerCase(); if(hay.indexOf(q)===-1)return false;} return true; });
  }
  function renderAudit(){
    var tb=$('#aud-tbody'); if(!tb)return; var rows=filteredAudit();
    $('#aud-count').textContent=rows.length+' event'+(rows.length===1?'':'s');
    if(!rows.length){ tb.innerHTML='<tr><td colspan="5" style="color:var(--gray-400)">No matching events.</td></tr>'; return; }
    tb.innerHTML=rows.map(function(e){var who=e.actorName?esc(e.actorName):'<span style="color:var(--gray-400)">system</span>';return '<tr><td style="white-space:nowrap">'+fmtWhen(e.ts)+'</td><td>'+who+'</td><td>'+esc(AUDIT_LABELS[e.action]||e.action)+'</td><td>'+(e.target?esc(e.target):'')+'</td><td style="color:var(--gray-600)">'+fmtDetails(e.metadata)+'</td></tr>';}).join('');
  }
  function exportAudit(){
    var rows=filteredAudit();var headr=['When','Who','Action','On','Details'];var cell=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"';};
    var lines=[headr.map(cell).join(',')];
    rows.forEach(function(e){lines.push([fmtWhen(e.ts),e.actorName||'system',(AUDIT_LABELS[e.action]||e.action),e.target||'',fmtDetails(e.metadata).replace(/ · /g,' | ')].map(cell).join(','));});
    var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='epstein-portal-audit.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }

  // ── search + modals ──
  function initGlobal(){
    $('#nav-search').oninput=function(e){var q=e.target.value.toLowerCase();$$('.snav-item').forEach(function(i){i.style.display=i.textContent.toLowerCase().indexOf(q)!==-1?'':'none';});};
    $$('.overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)closeModal(o);});});
    $$('[data-close]').forEach(function(b){b.onclick=function(e){closeModal(e.target.closest('.overlay'));};});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=$$('.overlay.open')[0];if(m)closeModal(m);}});
  }
  function openModal(id){$('#'+id).classList.add('open');}
  function closeModal(el){el&&el.classList.remove('open');}

  // ── boot ──
  jget('/api/me').then(function(r){
    if(r.status===401||!r.ok) throw new Error('unauth');
    me=r.j;
    return jget('/api/me/settings').then(function(sr){ if(sr&&sr.ok&&sr.j){ SETTINGS=sr.j.settings||null; if(sr.j.name) me.name=sr.j.name; } }).catch(function(){});
  }).then(function(){
    $('#app').style.display='flex';
    $('#who-name').textContent=me.name||'—';
    $('#who-role').textContent=(me.roles&&me.roles.length?me.roles.join(', '):'');
    $('#who-av').textContent=(me.name||me.email||'·').trim().charAt(0).toUpperCase();
    applyLang();
    buildNav(); initGlobal();
    if(me.isAdmin) updateApprBadge();
    var start=(location.hash||'').replace('#','');
    go(PAGES[start]?start:'profile');
  }).catch(function(){
    var s=$('#signin');s.style.display='block';s.innerHTML='';
    s.appendChild(document.createTextNode('Please sign in to the portal first, then reopen Settings. '));
    var a=document.createElement('a');a.href='/';a.textContent='Go to the portal';s.appendChild(a);
  });
})();
</script>
</body>
</html>
