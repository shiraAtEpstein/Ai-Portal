<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · Epstein & Co. · LAWLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efece4; --surface:#f6f2e9; --surface-2:#f5f2ec; --card:#faf8f2;
    --line:#e8e2d6; --line-2:#e4d9bf;
    --ink:#24211c; --ink-2:#4a463c; --mut:#837a68; --mut-2:#a89c80;
    --gold:#b28a3c; --gold-dark:#9a742d; --gold-soft:#c9b48a;
    --green:#6f8a55; --danger:#a6482f;
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:var(--gold);text-decoration:none;} a:hover{color:var(--gold-dark);}
  .app{display:flex;min-height:100vh;max-width:1080px;margin:0 auto;}
  aside{width:264px;flex:none;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}
  .brand b{font-size:15px;letter-spacing:.2px;} .brand span{display:block;font-size:12px;color:var(--mut);font-weight:500;}
  .back{display:block;font-size:13px;color:var(--mut);padding:6px 8px 14px;}
  .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut-2);margin:16px 8px 6px;}
  .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;color:var(--ink-2);font:inherit;font-size:14px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;}
  .navbtn:hover{background:var(--surface);}
  .navbtn.active{background:#efe7d3;color:var(--ink);font-weight:600;}
  .navbtn .ic{width:18px;text-align:center;opacity:.8;}
  .who{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:#e4d9bf;color:var(--gold-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .who b{font-size:13.5px;} .who span{display:block;font-size:12px;color:var(--mut);}
  main{flex:1;padding:30px 34px 70px;min-width:0;}
  .h1{font-size:24px;font-weight:700;margin:0 0 3px;}
  .sub{color:var(--mut);font-size:14px;margin:0 0 26px;}
  section.panel{display:none;} section.panel.active{display:block;animation:floatUp .25s ease;}
  @keyframes floatUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  h2{font-size:15px;font-weight:700;margin:26px 0 4px;} h2:first-child{margin-top:0;}
  .desc{color:var(--mut);font-size:13.5px;margin:0 0 14px;max-width:60ch;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
  .row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-top:1px solid var(--line);}
  .row:first-child{border-top:none;}
  .row .txt{flex:1;font-size:14.5px;} .row .meta{color:var(--mut);font-size:12px;margin-top:3px;}
  .pill{display:inline-block;font-size:11px;color:#fff;background:var(--gold);border-radius:999px;padding:2px 9px;margin-bottom:6px;font-weight:600;}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:14px 16px;border-top:1px solid var(--line);font-size:14px;}
  .kv:first-child{border-top:none;} .kv .k{color:var(--mut);} .kv .v{font-weight:600;}
  .del{background:transparent;color:var(--danger);border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .del:hover{border-color:var(--danger);}
  .empty{color:var(--mut);font-size:14px;padding:18px 16px;}
  .soon{border:1px dashed var(--line-2);background:var(--surface);border-radius:var(--r);padding:18px;color:var(--mut);font-size:13.5px;}
  .soon b{color:var(--ink-2);}
  .lookup{display:flex;gap:8px;margin:0 0 14px;}
  .lookup input{flex:1;background:#fff;border:1px solid var(--line-2);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:14px;}
  .lookup button{background:var(--gold);color:#fff;border:none;border-radius:var(--r-sm);padding:0 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
  .lookup button:hover{background:var(--gold-dark);}
  .signin{max-width:520px;margin:80px auto;text-align:center;color:var(--mut);}
  [dir="rtl"]{direction:rtl;}
  @media(max-width:720px){ .app{flex-direction:column;} aside{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);} }
</style>
</head>
<body>
<div id="signin" class="signin" style="display:none"></div>
<div class="app" id="app" style="display:none">
  <aside>
    <div class="brand"><div class="logo">L</div><div><b>LAWLY</b><span>Epstein &amp; Co.</span></div></div>
    <a class="back" href="/">← Back to chat</a>
    <div id="nav"></div>
    <div class="who"><div class="avatar" id="avatar">·</div><div><b id="whoName">—</b><span id="whoRole"></span></div></div>
  </aside>
  <main>
    <div class="h1">Settings</div>
    <p class="sub" id="sub">Personal preferences and your saved memory.</p>
    <div id="panels"></div>
  </main>
</div>

<script>
(function(){
  var isRTL=function(s){return /[֐-׿]/.test(s||'');};
  var fmt=function(s){try{return new Date(s).toLocaleDateString();}catch(e){return '';}};
  var elc=function(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};

  // Nav model — mirrors the redesign's information architecture.
  var NAV=[
    {group:'You',items:[
      {id:'profile',ic:'◔',label:'Profile'},
      {id:'appearance',ic:'◑',label:'Appearance'},
      {id:'language',ic:'⌘',label:'Language & Region'},
      {id:'notifications',ic:'◇',label:'Notifications'},
    ]},
    {group:'Workspace',items:[
      {id:'agents',ic:'❖',label:'Agents & defaults'},
      {id:'data',ic:'⛨',label:'Security & data'},
      {id:'shortcuts',ic:'⌨',label:'Keyboard shortcuts'},
    ]},
  ];
  var me=null;

  function soon(desc){ var d=elc('div','soon'); var b=elc('b',null,'Coming soon. '); d.appendChild(b); d.appendChild(document.createTextNode(desc)); return d; }

  function panelProfile(){
    var w=elc('div');
    w.appendChild(elc('h2',null,'Profile'));
    w.appendChild(elc('p','desc','Your identity in the portal. Managed by the firm admin.'));
    var c=elc('div','card');
    [['Name',me.name||'—'],['Email',me.email||'—'],['Roles',(me.roles&&me.roles.length?me.roles.join(', '):'—')]].forEach(function(kv){
      var r=elc('div','kv'); r.appendChild(elc('span','k',kv[0])); r.appendChild(elc('span','v',kv[1])); c.appendChild(r);
    });
    w.appendChild(c);
    return w;
  }

  function panelData(){
    var w=elc('div');
    w.appendChild(elc('h2',null,'Your memory'));
    w.appendChild(elc('p','desc','What Lawly has learned about how you like to work, and the matter notes you asked it to remember. Delete anything, anytime. Firm rules always take priority.'));
    var box=elc('div'); w.appendChild(box); box.textContent='Loading…';
    fetch('/api/me/memory',{credentials:'include'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
      box.textContent='';
      box.appendChild(elc('div','desc','Preferences — applied in every chat.'));
      box.appendChild(memCard(d.preferences||[],'No preferences learned yet.',function(it){return {onDel:function(cb){forget({kind:'preference',text:it.text},cb);}};}));
      box.appendChild(elc('div','desc','Matter notes — private to the specific agent you saved them with.'));
      box.appendChild(memCard(d.facts||[],'No matter notes saved.',function(it){return {agent:it.agentId,onDel:function(cb){forget({kind:'fact',text:it.text,agentId:it.agentId},cb);}};}));
    }).catch(function(){box.textContent='Could not load your memory right now.';});

    if(me.isAdmin){
      w.appendChild(elc('h2',null,'Team memory · admin'));
      w.appendChild(elc('p','desc','Read-only. Look up what the assistant has stored for any staff member.'));
      var lk=elc('div','lookup');
      var inp=elc('input'); inp.type='email'; inp.placeholder='name@epsteinlaw.co.il';
      var b=elc('button',null,'Look up'); lk.appendChild(inp); lk.appendChild(b); w.appendChild(lk);
      var out=elc('div'); w.appendChild(out);
      b.onclick=function(){var email=(inp.value||'').trim();if(!email)return;out.textContent='Loading…';
        fetch('/api/admin/memory?email='+encodeURIComponent(email),{credentials:'include'})
        .then(function(r){if(r.status===403)throw new Error('forbidden');if(r.status===404)throw new Error('nouser');if(!r.ok)throw new Error('x');return r.json();})
        .then(function(d){out.textContent='';
          out.appendChild(elc('div','desc','Trusted preferences ('+(d.trusted||[]).length+')'));
          out.appendChild(memCard(d.trusted||[],'None.',null));
          out.appendChild(elc('div','desc','Staged, not yet trusted ('+(d.staged||[]).length+')'));
          out.appendChild(memCard(d.staged||[],'None.',null));
          out.appendChild(elc('div','desc','Matter notes ('+(d.facts||[]).length+')'));
          out.appendChild(memCard(d.facts||[],'None.',function(it){return {agent:it.agentId};}));
        }).catch(function(err){out.textContent=err.message==='forbidden'?'Admins only.':err.message==='nouser'?'No such user.':'Could not load.';});
      };

      w.appendChild(elc('h2',null,'Approvals · admin'));
      w.appendChild(soon('Pending firm house-rule change requests will appear here for you to approve or reject. Arrives with the approval-flow build.'));
    }
    return w;
  }

  function memCard(items,emptyTxt,optsFn){
    var c=elc('div','card');
    if(!items.length){c.appendChild(elc('div','empty',emptyTxt));return c;}
    items.forEach(function(it){
      var o=optsFn?optsFn(it):{};
      var r=elc('div','row'); var t=elc('div','txt');
      if(o.agent){t.appendChild(elc('span','pill',o.agent));t.appendChild(document.createElement('br'));}
      var sp=elc('span',null,it.text); if(isRTL(it.text))sp.setAttribute('dir','rtl'); t.appendChild(sp);
      var when=it.lastReaffirmed||it.createdAt; if(when)t.appendChild(elc('div','meta','updated '+fmt(when)));
      r.appendChild(t);
      if(o.onDel){var b=elc('button','del','Delete');b.onclick=function(){b.disabled=true;b.textContent='Deleting…';o.onDel(function(ok){if(ok)r.remove();else{b.disabled=false;b.textContent='Delete';alert('Could not delete — try again.');}});};r.appendChild(b);}
      c.appendChild(r);
    });
    return c;
  }
  function forget(body,cb){
    fetch('/api/me/memory/forget',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(j){cb(!!(j&&j.ok));}).catch(function(){cb(false);});
  }

  var SOON={
    appearance:'Theme (ivory / dark), text size, and density for your portal.',
    language:'Interface language and AI response language — English, עברית (RTL), and more — plus date & number formats. A right-to-left language flips the whole layout.',
    notifications:'Choose channels (email, in-app, desktop) and what is worth interrupting you for — task completion, mentions, reminders, a daily digest.',
    agents:'Your default assistant and which specialists appear first for you.',
    shortcuts:'View and customise keyboard shortcuts (⌘K search, / to switch specialist, ⌘⏎ to send).',
  };

  function buildPanel(id){
    if(id==='profile')return panelProfile();
    if(id==='data')return panelData();
    var w=elc('div'); var label=null;
    NAV.forEach(function(g){g.items.forEach(function(i){if(i.id===id)label=i.label;});});
    w.appendChild(elc('h2',null,label)); w.appendChild(soon(SOON[id]||'Planned in the portal redesign.'));
    return w;
  }

  function show(id){
    var panels=document.getElementById('panels'); panels.textContent='';
    var p=elc('section','panel active'); p.appendChild(buildPanel(id)); panels.appendChild(p);
    Array.prototype.forEach.call(document.querySelectorAll('.navbtn'),function(b){b.classList.toggle('active',b.getAttribute('data-id')===id);});
  }

  function buildNav(){
    var nav=document.getElementById('nav'); nav.textContent='';
    NAV.forEach(function(g){
      nav.appendChild(elc('div','navgroup',g.group));
      g.items.forEach(function(i){
        var b=elc('button','navbtn'); b.setAttribute('data-id',i.id);
        b.appendChild(elc('span','ic',i.ic)); b.appendChild(document.createTextNode(i.label));
        b.onclick=function(){show(i.id);};
        nav.appendChild(b);
      });
    });
  }

  fetch('/api/me',{credentials:'include'}).then(function(r){if(r.status===401)throw new Error('unauth');if(!r.ok)throw new Error('x');return r.json();})
  .then(function(data){
    me=data;
    document.getElementById('app').style.display='flex';
    document.getElementById('whoName').textContent=me.name||'—';
    document.getElementById('whoRole').textContent=(me.roles&&me.roles.length?me.roles.join(', '):'');
    document.getElementById('avatar').textContent=(me.name||me.email||'·').trim().charAt(0).toUpperCase();
    buildNav(); show('profile');
  }).catch(function(){
    var s=document.getElementById('signin'); s.style.display='block'; s.textContent='';
    s.appendChild(document.createTextNode('Please sign in to the portal first, then reopen this page. '));
    var a=elc('a',null,'Go to the portal'); a.href='/'; s.appendChild(a);
  });
})();
</script>
</body>
</html>
