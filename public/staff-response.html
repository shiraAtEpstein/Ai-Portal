<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לוח מענה — משוב אישי וצוותי</title>
<!--
  Staff response board. Rebuilt 2026-08-20 around five measures:
    1. אחוזי מענה   — share answered within 1h / 4h / 8h. No target, no SLA.
    2. מגמה         — the same median week by week, as a sparkline.
    3. שעות שיא     — median by the hour the client wrote, so "when am I fastest".
    4. ממתינות      — today's live backlog, editable in place.
    5. עקביות       — per day: did the day end with your conversations answered.
  "Volume by type" is deliberately absent: the database stores an urgency
  category, not a subject, and Shira asked for real topics as a separate build.

  PERMISSIONS: an admin sees every person; everybody else sees their own card
  plus the firm baselines. The cut is made SERVER-side in routes/staff-response.js
  — this page only renders whatever it was given.

  Charts follow the house dataviz rules: single-series sparkline (no legend, the
  heading names it, only the last point labelled), and a status strip whose
  colours were validated for colour-vision deficiency and carry a glyph + legend
  so nothing is encoded by colour alone.
-->
<style>
  :root{
    --bg:#f2f3f5; --card:#fff; --ink:#1f2430; --muted:#8a9099; --line:#eceef1;
    --dark:#2b2f38; --darksub:#9aa1ac; --teal:#6e8b7c;
    /* Status ramp — validated: CVD ΔE 7.9 worst adjacent (legal with the glyph
       + gap secondary encoding), normal-vision ΔE 15.4, all >= 3:1 on surface. */
    --ok:#2e7d46; --warn:#bf8100; --bad:#cf3a26; --none:#d8dbe0;
    --okBg:#e7f4ec; --warnBg:#fdf6e7; --badBg:#fdeeeb; --infoBg:#eef0fb; --info:#3f4bbd;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,"Segoe UI",sans-serif;direction:rtl;}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 44px;}

  .topbar{background:var(--dark);border-radius:12px;padding:20px 24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .topbar .t1{color:var(--darksub);font-size:12px;margin-bottom:6px;}
  .topbar .t2{color:#fff;font-size:21px;font-weight:bold;}
  .topbar .t3{color:var(--darksub);font-size:12.5px;margin-top:6px;}
  .topActions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .btnRow{display:flex;gap:8px;}
  .btn{border:0;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .btn.ghost{background:#3a3f4a;color:#e8eaee;}
  .btn.mail{background:#4a5560;color:#fff;}
  .btn:disabled{opacity:.55;cursor:default;}
  .mailNote{font-size:11.5px;color:var(--darksub);max-width:320px;text-align:left;line-height:1.5;}
  .mailNote.ok{color:#8fd6a8;} .mailNote.err{color:#f0a79a;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 16px;}
  .kpi .lbl{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .kpi .val{font-size:27px;font-weight:bold;line-height:1;font-variant-numeric:tabular-nums;}
  .kpi .sub{font-size:12px;color:var(--teal);margin-top:7px;}
  .kpi.hero{background:#2f3b34;border-color:#2f3b34;}
  .kpi.hero .lbl{color:#a9bdb0;} .kpi.hero .val{color:#fff;} .kpi.hero .sub{color:#a9bdb0;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px;overflow:hidden;}
  .phead{padding:15px 20px 4px;font-size:15.5px;font-weight:bold;}
  .psub{padding:0 20px 12px;font-size:12.5px;color:var(--muted);line-height:1.6;}

  /* --- firm percentile bars ------------------------------------------------ */
  .bars{padding:4px 20px 18px;display:grid;gap:12px;}
  .bar{display:grid;grid-template-columns:88px 1fr 92px;align-items:center;gap:12px;}
  .bar .bl{font-size:13px;font-weight:bold;color:var(--ink);}
  .bar .track{background:#f0f1f3;border-radius:5px;height:16px;overflow:hidden;}
  .bar .fill{height:100%;border-radius:5px 0 0 5px;background:var(--teal);}
  .bar .bv{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:left;}
  .bar .bv b{color:var(--ink);font-size:15px;}

  /* --- person cards -------------------------------------------------------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px 14px;}
  .card.me{border-color:#c8d4cb;box-shadow:0 0 0 2px #e7f0e9;}
  .card.expanded{grid-column:1 / -1;}
  .chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;}
  .cname{font-size:16px;font-weight:bold;}
  .cmeta{font-size:12px;color:var(--muted);white-space:nowrap;}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
  .m{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;}
  .m .mv{font-size:16px;font-weight:bold;font-variant-numeric:tabular-nums;line-height:1.15;}
  .m .ml{font-size:10.5px;color:var(--muted);margin-top:4px;}
  .m.dim .mv{color:#c2c6cc;}

  .sec{margin-top:13px;}
  .sech{font-size:11.5px;color:var(--muted);font-weight:bold;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .sech .note{font-weight:normal;color:#a8adb5;}
  .spark{display:block;width:100%;max-width:460px;height:44px;overflow:visible;}
  .empty{font-size:12px;color:#b0b5bc;padding:6px 0;}

  .strip{display:flex;gap:3px;max-width:560px;}
  .day{flex:1;min-width:0;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;line-height:1;cursor:default;}
  .day.ok{background:var(--ok);color:#fff;}
  .day.warn{background:var(--warn);color:#1f2430;}
  .day.bad{background:var(--bad);color:#fff;}
  .day.none{background:var(--none);color:#5d636b;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:7px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;}

  .backlog{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .blCount{font-size:12.5px;color:var(--muted);}
  .blCount b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;}
  .showBtn{font:inherit;font-size:12.5px;font-weight:bold;color:#2b2f38;background:#eef0f2;border:1px solid #e2e3e7;border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap;}
  .showBtn:hover{background:#e4e7ea;}
  .showBtn[disabled]{opacity:.45;cursor:default;}
  .showBtn.open{background:#2b2f38;color:#fff;border-color:#2b2f38;}

  .detail{margin-top:12px;background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:10px;}
  .detailScroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.inner{width:100%;min-width:640px;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table.inner th:first-child, table.inner td:first-child{min-width:230px;}
  table.inner th:nth-child(2), table.inner td:nth-child(2){white-space:nowrap;}
  /* Long Latin group names must wrap between words, never mid-word, and never
     one word per line. */
  .chatname{overflow-wrap:break-word;word-break:normal;}
  table.inner th{padding:7px 9px;font-size:10.5px;background:#f6f7f8;color:var(--muted);text-align:right;font-weight:bold;}
  table.inner td{padding:9px;font-size:12.5px;border-bottom:1px solid #f2f3f5;vertical-align:top;}
  table.inner tr:last-child td{border-bottom:0;}
  .chatname{font-weight:bold;line-height:1.35;}
  .client{font-size:11.5px;color:#93a08f;margin-top:2px;}
  .moved{font-size:11px;color:var(--warn);margin-top:3px;}
  .tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:bold;white-space:nowrap;}
  .tag.required{background:var(--badBg);color:#b0281c;}
  .tag.potential{background:var(--warnBg);color:#9a6a10;}
  .tag.voice{background:var(--infoBg);color:var(--info);}
  select{font:inherit;font-size:12px;border:1px solid #d9dce1;border-radius:6px;padding:4px 6px;background:#fff;color:var(--ink);max-width:150px;}
  select:disabled{opacity:.5;}
  tr.saving{opacity:.45;}
  .rowerr{color:var(--bad);font-size:11px;margin-top:4px;}
  .noneleft{padding:12px;text-align:center;color:#3f8f6a;font-size:12.5px;}

  .state{padding:44px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8;}
  .state a{color:#2b6cb0;}
  .foot{font-size:11.5px;color:var(--muted);line-height:1.7;padding:18px 4px 0;}
  .exclNote{padding:0 20px 14px;font-size:12px;color:var(--muted);line-height:1.6;}
  .staleNote{margin:16px 0 0;padding:11px 14px;border-radius:8px;background:var(--warnBg);border:1px solid #f0e2bf;color:#8a5d0c;font-size:12.5px;line-height:1.6;}
  .staleNote code{background:#f6ecd4;padding:1px 5px;border-radius:4px;}
  @media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr);}.cards{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="t1">Lawly · משרד אפשטיין</div>
      <div class="t2">לוח מענה — משוב אישי וצוותי</div>
      <div class="t3" id="meta">טוען…</div>
    </div>
    <div class="topActions">
      <div class="btnRow">
        <button class="btn mail" id="sendBtn" type="button" style="display:none" disabled>שלח לי את המייל עכשיו ✉</button>
        <button class="btn ghost" id="refreshBtn" type="button">רענון ↻</button>
      </div>
      <div class="mailNote" id="mailNote"></div>
    </div>
  </div>

  <div id="staleNote" style="display:none"></div>
  <div id="kpis" class="kpis"></div>

  <div class="panel">
    <div class="phead" id="pctHead">אחוזי מענה — כל המשרד</div>
    <div class="psub">מכלל השיחות בחלון — כולל אלה שעדיין ממתינות, לפי הזמן שהן ממתינות עד עכשיו. אין יעד; זו תמונת מצב, לא ציון.</div>
    <div class="bars" id="bars"></div>
  </div>

  <div id="cards" class="cards"></div>
  <div class="exclNote" id="exclNote"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ---------------------------------------------------------------- helpers */
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function fmtDur(s){
  if(s==null||!isFinite(s)) return '—';
  var v=Math.max(0,Math.round(s)), h=Math.floor(v/3600), m=Math.floor((v%3600)/60);
  return h+':'+String(m).padStart(2,'0');
}
function waitLabel(h){
  var n=Number(h);
  if(!isFinite(n)||n<=0) return '—';
  if(n>=24){var d=Math.round(n/24);return d===1?'יום':d===2?'יומיים':d+' ימים';}
  var hr=Math.max(1,Math.round(n));
  return hr===1?'שעה':hr===2?'שעתיים':hr+' שעות';
}
function waitColor(h){var n=Number(h)||0;return n>=72?'var(--bad)':n>=24?'var(--warn)':'var(--teal)';}
function hhmm(hr){return String(hr).padStart(2,'0')+':00';}
function pctTxt(p){return p==null?'—':p+'%';}
var STATUS_LABEL={required:'🔴 דורש מענה',potential:'🟡 אולי דורש מענה',voice:'🎤 הודעה קולית',pending:'⏳ בבדיקה'};

/* --------------------------------------------------------------- sign-in */
var TRIED_KEY='staffResponseAuthBounce';
function goSignIn(){
  var already=false;
  try{ already=sessionStorage.getItem(TRIED_KEY)==='1'; }catch(e){}
  if(already) return showSignInLink();
  try{ sessionStorage.setItem(TRIED_KEY,'1'); }catch(e){}
  var next=encodeURIComponent(location.pathname+location.search);
  fetch('/auth/google/status',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(j){ location.replace(j&&j.enabled?('/auth/google/start?next='+next):'/'); })
    .catch(function(){ location.replace('/'); });
}
function showSignInLink(){
  document.getElementById('meta').textContent='נדרשת התחברות';
  document.getElementById('cards').innerHTML=
    '<div class="panel"><div class="state">יש להתחבר כדי לראות את הלוח.<br><a href="/">מעבר לעמוד ההתחברות</a></div></div>';
}
function clearAuthBounce(){ try{ sessionStorage.removeItem(TRIED_KEY); }catch(e){} }

/* ------------------------------------------------------------ board meta */
var clearingStatuses=[], staffList=[], canEdit=false, myEmail='', iAmAdmin=false;
function loadMeta(){
  return fetch('/api/board/meta',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}})
    .then(function(r){ if(!r.ok) throw new Error('meta'); return r.json(); })
    .then(function(m){
      clearingStatuses=((m&&m.statuses)||[]).filter(function(s){return s.setBy==='staff'&&s.clears;});
      staffList=(m&&m.staff)||[]; myEmail=(m&&m.email)||''; iAmAdmin=!!(m&&m.isAdmin); canEdit=true;
    })
    .catch(function(){ clearingStatuses=[]; staffList=[]; canEdit=false; });
}
function post(url,body){
  return fetch(url,{method:'POST',credentials:'same-origin',cache:'no-store',
    headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok) throw new Error((j&&j.error)||('שגיאה (HTTP '+r.status+')')); return j; }); });
}

/* ------------------------------------------------------------- sparkline */
/* One series, so no legend — the heading names it. 2px line, only the newest
   point gets a marker and a label; a number on every point is noise. Each point
   carries an SVG <title> so hovering gives the week and the median.           */
function sparkline(points, label){
  var pts=(points||[]).filter(function(p){return p.medianSeconds!=null;});
  if(pts.length<2){
    var d=el('div','empty', pts.length?'שבוע אחד בלבד בחלון — אין עדיין מגמה':'אין נתונים למגמה');
    return d;
  }
  var W=300,H=44,padX=4,padT=8,padB=12;
  var vals=pts.map(function(p){return p.medianSeconds;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(max===min){ max=min+1; }
  var x=function(i){ return padX + i*((W-2*padX)/(pts.length-1)); };
  var y=function(v){ return padT + (1-(v-min)/(max-min))*(H-padT-padB); };

  var ns='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(ns,'svg');
  svg.setAttribute('class','spark');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('preserveAspectRatio','none');
  svg.setAttribute('role','img');
  var last=pts[pts.length-1];
  svg.setAttribute('aria-label', label+': '+pts.length+' שבועות, אחרון '+fmtDur(last.medianSeconds));

  var dAttr=pts.map(function(p,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(p.medianSeconds).toFixed(1);}).join(' ');
  var path=document.createElementNS(ns,'path');
  path.setAttribute('d',dAttr);
  path.setAttribute('fill','none');
  path.setAttribute('stroke','#6e8b7c');
  path.setAttribute('stroke-width','2');
  path.setAttribute('stroke-linejoin','round');
  path.setAttribute('stroke-linecap','round');
  path.setAttribute('vector-effect','non-scaling-stroke');
  svg.appendChild(path);

  pts.forEach(function(p,i){
    var c=document.createElementNS(ns,'circle');
    var isLast=i===pts.length-1;
    c.setAttribute('cx',x(i).toFixed(1)); c.setAttribute('cy',y(p.medianSeconds).toFixed(1));
    c.setAttribute('r', isLast?'4':'3');
    c.setAttribute('fill', isLast?'#2f3b34':'transparent');
    c.setAttribute('stroke', isLast?'#fff':'transparent');
    c.setAttribute('stroke-width','1.5');
    var t=document.createElementNS(ns,'title');
    t.textContent='שבוע '+p.week+' · חציון '+fmtDur(p.medianSeconds)+' · '+p.replies+' מענים';
    c.appendChild(t);
    svg.appendChild(c);
  });

  var box=el('div');
  box.appendChild(svg);
  return box;
}

// The trend in a sentence. Comparing the first point to the last let one freak
// week at either end flip the label; this compares the CURRENT week to the
// median of the person's own completed weeks, and says both numbers out loud.
function trendSentence(change){
  var d=el('div');
  d.style.fontSize='12.5px';
  d.style.marginTop='4px';
  if(!change){ d.className='empty'; d.textContent='אין עדיין מספיק שבועות להשוואה'; return d; }
  var dir = change.pct<=-5 ? {t:'שיפור',c:'var(--ok)'}
          : change.pct>=5  ? {t:'האטה',c:'var(--bad)'}
          : {t:'ללא שינוי',c:'var(--muted)'};
  var strong=el('b',null,dir.t+(Math.abs(change.pct)>=5?(' של '+Math.abs(change.pct)+'%'):''));
  strong.style.color=dir.c;
  d.appendChild(strong);
  d.appendChild(document.createTextNode(
    ' — השבוע ' + fmtDur(change.currentSeconds) + ' (' + change.currentReplies + ' מענים), ' +
    'מול ' + fmtDur(change.baselineSeconds) + ' ב-' + change.baselineWeeks + ' השבועות הקודמים'));
  return d;
}

/* ------------------------------------------------- consistency day strip */
/* Status encoding, so every cell carries a GLYPH and there is a legend — the
   colour never carries the meaning on its own.                              */
function dayClass(d){
  // The day is scored on what was STILL OPEN when it ended — not on what
  // arrived. An old unanswered message darkens every day it survives.
  if(d.clean) return {c:'ok',g:'✓',t:'היום נסגר בלי הודעות ממתינות'};
  if(d.openAtEndOfDay>=3) return {c:'bad',g:String(d.openAtEndOfDay),t:d.openAtEndOfDay+' הודעות נשארו ממתינות בסוף היום'};
  return {c:'warn',g:String(d.openAtEndOfDay),t:d.openAtEndOfDay+' הודעות נשארו ממתינות בסוף היום'};
}
function dayStrip(cons){
  if(!cons||!cons.days||!cons.days.length) return el('div','empty','אין נתוני עקביות בחלון');
  var wrapEl=el('div');
  var strip=el('div','strip');
  cons.days.forEach(function(d){
    var k=dayClass(d);
    var cell=el('div','day '+k.c, k.g);
    cell.title=d.date+' · '+k.t+(d.arrived?(' · נפתחו באותו יום: '+d.arrived):'')+
      (d.oldestOpenDays?(' · הוותיקה ממתינה '+d.oldestOpenDays+' ימים'):'');
    strip.appendChild(cell);
  });
  wrapEl.appendChild(strip);
  var lg=el('div','legend');
  [['ok','✓','נסגר נקי'],['warn','1–2','נשארו ממתינות'],['bad','3+','נשארו הרבה']].forEach(function(x){
    var s=el('span');
    var sw=el('span','swatch'); sw.style.background='var(--'+x[0]+')';
    s.appendChild(sw); s.appendChild(document.createTextNode(x[1]+' '+x[2]));
    lg.appendChild(s);
  });
  wrapEl.appendChild(lg);
  return wrapEl;
}

/* ---------------------------------------------------- editable backlog */
function statusSelect(it,tr,errBox){
  var sel=document.createElement('select');
  var ph=document.createElement('option'); ph.value=''; ph.textContent='סמן כטופל…'; sel.appendChild(ph);
  clearingStatuses.forEach(function(s){
    var o=document.createElement('option'); o.value=s.key; o.textContent=(s.icon?s.icon+' ':'')+s.label; sel.appendChild(o);
  });
  sel.addEventListener('change',function(){
    if(!sel.value) return;
    var chosen=sel.value; sel.value='';
    errBox.textContent=''; sel.disabled=true; tr.classList.add('saving');
    post('/api/board/status',{chatJid:it.chatJid,status:chosen})
      .then(function(){ setTimeout(function(){ load(true); },420); })
      .catch(function(e){ sel.disabled=false; tr.classList.remove('saving'); errBox.textContent=e.message||'לא ניתן לעדכן.'; });
  });
  return sel;
}
function responsibleSelect(it,tr,errBox){
  var sel=document.createElement('select');
  var ph=document.createElement('option'); ph.value=''; ph.textContent='— אוטומטי —'; sel.appendChild(ph);
  var cur=(it.responsibleEmails&&it.responsibleEmails[0])||'';
  staffList.forEach(function(s){
    var o=document.createElement('option'); o.value=s.email; o.textContent=s.name;
    if(it.manualAssigned&&s.email&&cur&&s.email.toLowerCase()===cur.toLowerCase()) o.selected=true;
    sel.appendChild(o);
  });
  if(!it.manualAssigned) sel.value='';
  sel.addEventListener('change',function(){
    var chosen=sel.value;
    errBox.textContent=''; sel.disabled=true; tr.classList.add('saving');
    post('/api/board/responsible',{chatJid:it.chatJid,email:chosen})
      .then(function(){ setTimeout(function(){ load(true); },350); })
      .catch(function(e){ sel.disabled=false; tr.classList.remove('saving'); errBox.textContent=e.message||'לא ניתן לעדכן אחראי.'; });
  });
  return sel;
}
function detailTable(items){
  var box=el('div','detail');
  if(!items.length){ box.appendChild(el('div','noneleft','אין כרגע הודעות ממתינות 🎉')); return box; }
  var t=el('table','inner');
  var head=el('tr');
  ['קבוצה / לקוח','סוג','ממתין','אחראי','פעולה'].forEach(function(h){ head.appendChild(el('th',null,h)); });
  t.appendChild(head);
  items.forEach(function(it){
    var tr=el('tr'), errBox=el('div','rowerr');
    var nameTd=el('td');
    nameTd.appendChild(el('div','chatname',it.label||'—'));
    if(it.clientName) nameTd.appendChild(el('div','client',it.clientName));
    if(it.unansweredCount>1) nameTd.appendChild(el('div','client',it.unansweredCount+' הודעות ללא מענה'));
    if(it.movedFromExcluded) nameTd.appendChild(el('div','moved','↩ משויך ל-'+it.movedFromExcluded+' (מחוץ ללוח)'));
    nameTd.appendChild(errBox); tr.appendChild(nameTd);
    var typeTd=el('td'); typeTd.appendChild(el('span','tag '+(it.status||'potential'),STATUS_LABEL[it.status]||it.status||'—')); tr.appendChild(typeTd);
    var wTd=el('td',null,waitLabel(it.hoursWaiting)); wTd.style.color=waitColor(it.hoursWaiting); wTd.style.fontWeight='bold'; wTd.style.whiteSpace='nowrap'; tr.appendChild(wTd);
    var rTd=el('td');
    if(canEdit&&staffList.length&&it.chatJid) rTd.appendChild(responsibleSelect(it,tr,errBox));
    else rTd.appendChild(el('span',null,it.responsibleName||'—'));
    tr.appendChild(rTd);
    var aTd=el('td');
    if(canEdit&&clearingStatuses.length&&it.chatJid) aTd.appendChild(statusSelect(it,tr,errBox));
    else aTd.appendChild(el('span',null,'—'));
    tr.appendChild(aTd);
    t.appendChild(tr);
  });
  var scroller=el('div','detailScroll');
  scroller.appendChild(t);
  box.appendChild(scroller);
  return box;
}

/* ------------------------------------------------------------ the cards */
var openCards={}, LAST=null;

function metricTile(value, label, dim){
  var m=el('div','m'+(dim?' dim':''));
  m.appendChild(el('div','mv',value));
  m.appendChild(el('div','ml',label));
  return m;
}

function personCard(s, isMe, windowDays, consistencyDays){
  var isOpen=!!openCards[s.email||s.name] && (s.items||[]).length;
  var card=el('div','card'+(isMe?' me':'')+(isOpen?' expanded':''));
  var head=el('div','chead');
  head.appendChild(el('div','cname', s.name + (isMe?' (את/ה)':'')));
  head.appendChild(el('div','cmeta', s.measured
    ? (s.measured+' שיחות · ' + s.answeredCount + ' נענו' + (s.openCount ? (' · ' + s.openCount + ' עדיין ממתינות') : ''))
    : 'אין שיחות בחלון'));
  card.appendChild(head);

  var mets=el('div','metrics');
  mets.appendChild(metricTile(s.median||'—','חציון', !s.measured));
  mets.appendChild(metricTile(pctTxt(s.within1hPct),'תוך שעה', !s.measured));
  mets.appendChild(metricTile(pctTxt(s.within4hPct),'תוך 4 שעות', !s.measured));
  mets.appendChild(metricTile(pctTxt(s.within8hPct),'תוך 8 שעות', !s.measured));
  card.appendChild(mets);
  if(s.openCount){
    var warn=el('div','empty');
    warn.style.color='var(--warn)';
    warn.style.marginTop='-8px';
    warn.textContent='כולל '+s.openCount+' שיחות שעדיין ממתינות, לפי הזמן שהן ממתינות עד עכשיו.';
    card.appendChild(warn);
  }

  var trendSec=el('div','sec');
  var th=el('div','sech'); th.appendChild(el('span',null,'מגמה שבועית (שיחות שנענו)'));
  th.appendChild(el('span','note', s.trend&&s.trend.length?(s.trend.length+' שבועות'):''));
  trendSec.appendChild(th);
  trendSec.appendChild(sparkline(s.trend,'מגמת חציון של '+s.name));
  trendSec.appendChild(trendSentence(s.change));
  card.appendChild(trendSec);

  var peakSec=el('div','sec');
  var ph2=el('div','sech');
  ph2.appendChild(el('span',null,'מתי אתה הכי מהיר'));
  ph2.appendChild(el('span','note','לפי השעה שבה הלקוח כתב'));
  peakSec.appendChild(ph2);
  var bands=s.bands||[];
  if(bands.length){
    // The full profile across the day, so it reads as "you are a morning
    // person" rather than a single hour that could be noise.
    var slowest=bands.reduce(function(a,b){return b.medianSeconds>a.medianSeconds?b:a;});
    var maxv=slowest.medianSeconds||1;
    var tbl=el('div');
    bands.forEach(function(b){
      var row=el('div','bar');
      row.style.gridTemplateColumns='104px 1fr 96px';
      row.style.marginBottom='5px';
      var lab=el('div','bl',b.label); lab.style.fontWeight='normal'; lab.style.fontSize='12px';
      row.appendChild(lab);
      var track=el('div','track'); track.style.height='12px';
      var fill=el('div','fill');
      fill.style.width=Math.max(4,Math.round((b.medianSeconds/maxv)*100))+'%';
      // Best band gets the accent; the rest stay recessive so the eye lands on it.
      fill.style.background=(s.bestBand&&b.key===s.bestBand.key)?'var(--ok)':'#c3ccc6';
      track.appendChild(fill); row.appendChild(track);
      var v=el('div','bv'); v.innerHTML='<b>'+fmtDur(b.medianSeconds)+'</b> <span>('+b.replies+')</span>';
      row.appendChild(v);
      tbl.appendChild(row);
    });
    peakSec.appendChild(tbl);
    if(s.bestBand){
      var note=el('div');
      note.style.fontSize='12.5px'; note.style.marginTop='4px';
      note.innerHTML='הכי מהיר ב<b>'+s.bestBand.label+'</b>'+
        (s.bestHour?(' · השעה החזקה ביותר: <b>'+hhmm(s.bestHour.hour)+'</b>'):'');
      peakSec.appendChild(note);
    }
  } else {
    peakSec.appendChild(el('div','empty','אין עדיין מספיק שיחות שנענו כדי לראות פרופיל שעות'));
  }
  card.appendChild(peakSec);

  var consSec=el('div','sec');
  var ch=el('div','sech');
  ch.appendChild(el('span',null,'עקביות — '+consistencyDays+' הימים האחרונים'));
  var c=s.consistency;
  ch.appendChild(el('span','note', c&&c.cleanPct!=null ? (c.cleanDays+' מתוך '+c.totalDays+' ימים נסגרו נקי') : ''));
  consSec.appendChild(ch);
  consSec.appendChild(dayStrip(c));
  if(c){
    var sum=el('div','empty');
    sum.style.color = c.openNow ? 'var(--bad)' : 'var(--muted)';
    sum.textContent = c.openNow
      ? ('כרגע ממתינות לך ' + c.openNow + ' הודעות — היום עוד לא ייסגר נקי')
      : 'אין כרגע הודעות ממתינות לך 🎉';
    consSec.appendChild(sum);
  }
  card.appendChild(consSec);

  var items=s.items||[];
  var bl=el('div','backlog');
  var cnt=el('div','blCount');
  cnt.innerHTML='ממתינות עכשיו: <b>'+items.length+'</b>'+
    (items.length?' <span style="color:var(--muted)">('+(s.byStatus.required||0)+' 🔴 · '+(s.byStatus.potential||0)+' 🟡 · '+(s.byStatus.voice||0)+' 🎤)</span>':'');
  bl.appendChild(cnt);
  var key=s.email||s.name;
  var btn=el('button','showBtn'+(openCards[key]?' open':''), items.length?('הצג הודעות ממתינות ('+items.length+')'):'אין ממתינות');
  btn.type='button';
  if(!items.length) btn.disabled=true;
  btn.addEventListener('click',function(){ openCards[key]=!openCards[key]; render(LAST); });
  bl.appendChild(btn);
  card.appendChild(bl);
  if(isOpen) card.appendChild(detailTable(items));
  return card;
}

/* ----------------------------------------------------------- firm panels */
function kpi(lbl,val,sub,hero){
  return '<div class="kpi'+(hero?' hero':'')+'"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>';
}
function renderBars(f){
  var box=document.getElementById('bars');
  box.innerHTML='';
  [['תוך שעה',f.within1hPct,f.within1h],['תוך 4 שעות',f.within4hPct,f.within4h],['תוך 8 שעות',f.within8hPct,f.within8h]]
  .forEach(function(row){
    var b=el('div','bar');
    b.appendChild(el('div','bl',row[0]));
    var track=el('div','track'); var fill=el('div','fill');
    fill.style.width=(row[1]==null?0:row[1])+'%';
    track.appendChild(fill); b.appendChild(track);
    var v=el('div','bv');
    v.innerHTML='<b>'+pctTxt(row[1])+'</b>'+(row[2]!=null&&f.measured?(' <span>'+row[2]+'/'+f.measured+'</span>'):'');
    b.appendChild(v);
    box.appendChild(b);
  });
}

function render(d){
  if(!d) return;
  LAST=d;
  var f=d.firm||{}, mine=d.scope==='self';

  document.getElementById('meta').textContent=
    (mine?'התצוגה שלך':'תצוגת כל המשרד')+' · חלון '+d.windowDays+' ימים · ללא יעד זמן · עודכן '+
    new Date(d.generatedAt).toLocaleString('he-IL');

  // Version guard: every metric below is computed server-side. If the payload
  // has no teamMedian the server is older than this page, and the cards would
  // silently fill with dashes. Say so instead.
  var stale=document.getElementById('staleNote');
  if(f.teamMedianSeconds==null&&(d.staff||[]).some(function(s){return s.measured>0;})){
    stale.className='staleNote'; stale.style.display='';
    stale.innerHTML='⚠ <b>השרת מריץ גרסה ישנה של הדוח.</b> חלק מהמדדים יופיעו ריקים. ' +
      'ודאו ש-<code>lib/staff-response.js</code> ו-<code>lib/staff-metrics.js</code> הועלו בשמות האלה ושה-deploy הסתיים.';
  } else { stale.style.display='none'; stale.className=''; }

  var cons=f.consistency;
  document.getElementById('kpis').innerHTML=
    kpi('חציון מענה לכל הודעה',(f.median||'—'),
        'כולל '+(f.openCount||0)+' שממתינות עכשיו · '+(f.measured||0)+' שיחות',true)+
    kpi('חציון הצוות',(f.teamMedian||'—'),'החציון של איש צוות טיפוסי'+(f.teamSize?(' · '+f.teamSize+' אנשים'):''))+
    kpi('ממתינות עכשיו',(f.openTotal!=null?f.openTotal:'—'),((f.required||0)+' דורשות · '+(f.voice||0)+' קוליות'))+
    kpi('ימים שנסגרו נקי',(cons&&cons.cleanPct!=null?cons.cleanPct+'%':'—'),
        cons?(cons.cleanDays+' מתוך '+cons.totalDays+' ימים בלי הודעות ממתינות בסוף היום'):'—');

  document.getElementById('pctHead').textContent = mine ? 'אחוזי מענה — כל המשרד (לשם השוואה)' : 'אחוזי מענה — כל המשרד';
  renderBars(f);

  var box=document.getElementById('cards');
  box.innerHTML='';
  var list=(d.staff||[]).slice().sort(function(a,b){
    if((b.items||[]).length!==(a.items||[]).length) return (b.items||[]).length-(a.items||[]).length;
    return (b.replies||0)-(a.replies||0);
  });
  if(!list.length){
    box.innerHTML='<div class="panel"><div class="state">אין עדיין נתונים עבורך בחלון הזמן הזה.</div></div>';
  } else {
    list.forEach(function(s){
      var isMe=!!myEmail&&String(s.email||'').toLowerCase()===myEmail.toLowerCase();
      box.appendChild(personCard(s,isMe,d.windowDays,d.consistencyDays||14));
    });
  }

  var parts=[];
  if(f.excluded&&f.excluded.length) parts.push('לא נכללים בלוח ובחישוב: '+f.excluded.join(' · '));
  if(f.firmLineIncluded===false) parts.push('קו Lawly (משותף) לא נכלל');
  if(f.consistencyUnattributed) parts.push(f.consistencyUnattributed+' שיחות ללא אחראי מזוהה לא נספרו בעקביות של אף אחד');
  document.getElementById('exclNote').textContent=parts.length?(parts.join(' · ')+'.'):'';

  document.getElementById('foot').textContent=
    'המספרים מחושבים מהיסטוריית ההודעות (processing_jobs). ' +
    'החציון והאחוזים כוללים גם שיחות שעדיין ממתינות — לפי הזמן שהן ממתינות עד עכשיו, שהוא רף תחתון. ' +
    'שיחה שנענתה נזקפת למי שענה בפועל; שיחה שלא נענתה נזקפת לאחראי עליה. ' +
    'המגמה ופרופיל השעות מחושבים על שיחות שנענו בלבד, כי לשיחה פתוחה אין עדיין שבוע מענה. ' +
    'יום נספר כ"נסגר נקי" אם בסופו לא נשארה אף הודעה שממתינה לך, לא משנה מתי היא הגיעה. ' +
    'האחראי נלקח מהמצב הנוכחי — שיוך היסטורי לא נשמר. שיחה יורדת מהרשימה ברגע שמישהו במשרד עונה בוואטסאפ.';
}

/* ------------------------------------------------------------- the fetch */
var loading=false, refreshBtn=document.getElementById('refreshBtn');
var sendBtn=document.getElementById('sendBtn'), mailNote=document.getElementById('mailNote');

function load(quiet){
  if(loading) return;
  loading=true; refreshBtn.disabled=true;
  if(!quiet) document.getElementById('meta').textContent='טוען…';
  fetch('/api/staff-response?windowDays=30',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}})
    .then(function(r){
      if(r.status===401){ var e=new Error('auth'); e.auth=true; throw e; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(d){ clearAuthBounce(); render(d); })
    .catch(function(e){
      if(e&&e.auth){ goSignIn(); return; }
      document.getElementById('meta').textContent='שגיאה בטעינת הנתונים';
      document.getElementById('cards').innerHTML='<div class="panel"><div class="state">לא ניתן לטעון את הלוח. נסו רענון.</div></div>';
    })
    .then(function(){ loading=false; refreshBtn.disabled=false; });
}

/* "שלח לי את המייל עכשיו" — admin only (the endpoint is admin-gated), and it
   sends to the SIGNED-IN address, taken from the session and never typed. */
function armSendButton(){
  if(!iAmAdmin||!myEmail){ sendBtn.style.display='none'; return; }
  sendBtn.style.display=''; sendBtn.disabled=false; sendBtn.title='נשלח אל '+myEmail;
  mailNote.className='mailNote'; mailNote.textContent='ייבדק בתיבה של '+myEmail;
}
sendBtn.addEventListener('click',function(){
  if(!myEmail) return;
  sendBtn.disabled=true;
  var orig=sendBtn.textContent; sendBtn.textContent='שולח…';
  mailNote.className='mailNote'; mailNote.textContent='בונה את הדוח ושולח…';
  post('/api/admin/staff-response/send-report?to='+encodeURIComponent(myEmail),{})
    .then(function(r){
      var one=(r&&r.sent&&r.sent[0])||null;
      if(one&&one.ok===false){ mailNote.className='mailNote err'; mailNote.textContent='השליחה נכשלה: '+(one.reason||'סיבה לא ידועה'); }
      else { mailNote.className='mailNote ok'; mailNote.textContent='נשלח אל '+myEmail+'. הנושא מתחיל ב-"[בדיקה]".'; }
    })
    .catch(function(e){ mailNote.className='mailNote err'; mailNote.textContent=e.message||'לא ניתן לשלוח כרגע.'; })
    .then(function(){ sendBtn.disabled=false; sendBtn.textContent=orig; });
});

refreshBtn.addEventListener('click',function(){ load(false); });
loadMeta().then(function(){ armSendButton(); load(false); });
</script>
