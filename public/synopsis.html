<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפקת סינופסיס · LAWLY</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f2ec; --card:#fffefb; --ink:#24211c; --ink2:#4a463c; --ink3:#8b8478;
    --line:#e8e2d6; --line2:#e2d9c6; --shade:#faf8f3;
    --gold:#b28a3c; --green:#6f8a55; --red:#9c3b28; --blue:#4a6a8a;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',-apple-system,sans-serif;
       font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:26px 24px 80px}

  header{display:flex;align-items:center;justify-content:space-between;
         border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:26px}
  .brand{font-size:22px;font-weight:700;letter-spacing:.02em}
  .brand span{color:var(--gold)}
  .who{font-family:var(--mono);font-size:11px;color:var(--ink3);direction:ltr}
  .mode{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
        padding:3px 8px;border-radius:5px;background:#f7ecd8;color:#8a6520;margin-inline-start:8px}
  .mode.live{background:#eef2e8;color:#47603a}

  h1{font-size:29px;font-weight:600;margin:0 0 5px}
  .sub{color:var(--ink2);font-size:14.5px;margin:0 0 24px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:22px 24px;margin-bottom:16px}

  label.fl{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:6px}
  .fl.reqf{font-weight:600}
  .req{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;background:#f6e2dd;color:#8a2f1c;
       padding:2px 6px;border-radius:4px;margin-inline-start:6px;vertical-align:2px}
  .opt{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;background:#efece6;color:#5d564a;
       padding:2px 6px;border-radius:4px;margin-inline-start:6px;vertical-align:2px}
  .own{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;background:#e6eef5;color:#2f5474;
       padding:2px 6px;border-radius:4px;margin-inline-start:6px;vertical-align:2px;direction:rtl}
  .own.mirror{background:#f7ecd8;color:#8a6520}

  input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line2);background:var(--shade);
    border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14.5px;color:var(--ink);outline:none}
  input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--gold);background:#fff}
  input.inp.err{border-color:var(--red);background:#fdf6f4}
  input[type=date].inp,input[type=number].inp{direction:ltr;text-align:right}

  .btn{font-size:13.5px;font-weight:500;background:var(--ink);color:#fdfcf8;border:none;border-radius:999px;
       padding:10px 26px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
  .btn.gold{background:var(--gold);color:#fff}
  .btnrow{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}

  .results{border:1px solid var(--line2);border-top:none;border-radius:0 0 8px 8px;background:#fff;overflow:hidden}
  .res{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;
       justify-content:space-between;align-items:center;gap:10px}
  .res:last-child{border-bottom:none}
  .res:hover{background:var(--shade)}
  .res .bd{font-family:var(--mono);font-size:10px;color:var(--ink3)}

  .steps{margin:8px 0}
  .step{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .step:last-child{border-bottom:none}
  .tick{width:18px;flex:none;font-family:var(--mono);font-size:14px;color:var(--ink3)}
  .tick.ok{color:var(--green)} .tick.no{color:var(--red)}
  .step .meta{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
  .bar{height:5px;background:var(--line2);border-radius:999px;overflow:hidden;margin:16px 0 4px}
  .bar span{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .4s ease}

  .summary{display:flex;gap:22px;flex-wrap:wrap;padding:14px 0 2px;border-top:1px solid var(--line);margin-top:14px}
  .stat{display:flex;flex-direction:column}
  .stat b{font-size:24px;font-weight:600;line-height:1.15}
  .stat span{font-size:11.5px;color:var(--ink3)}
  .stat.warn b{color:var(--red)}

  .grp{margin-top:22px}
  .grph{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--gold);
        padding-bottom:7px;border-bottom:1px solid var(--line2);margin-bottom:15px}
  .grpnote{font-weight:400;color:var(--ink3);font-size:11.5px;letter-spacing:0;margin-inline-start:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
  @media (max-width:700px){.grid{grid-template-columns:1fr}}
  .grid > .wide{grid-column:1 / -1}
  textarea.inp.big{min-height:170px;line-height:1.75;resize:vertical;font-size:15px}
  .rel{position:relative}
  .rel .results{position:absolute;inset-inline:0;z-index:5;border-radius:0 0 8px 8px;max-height:220px;overflow:auto}
  .rel-q.picked{border-color:var(--green);background:#fff}
  .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
  .hint.mirror{color:#8a6520}

  .known{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--shade);
         border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .known b{color:var(--ink)}
  .srcline{padding:8px 0;border-top:1px solid var(--line2);margin-top:8px}
  .srcline:first-of-type{border-top:none}
  .srcname{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
           background:#e6eef5;color:#2f5474;padding:2px 7px;border-radius:4px;margin-inline-end:10px}
  .kv{display:inline-block;margin-inline-end:14px;max-width:100%;
      white-space:normal;overflow-wrap:anywhere;vertical-align:top}
  .kv.long{display:block;margin:6px 0 0;white-space:pre-wrap;line-height:1.6}
  .knownhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .toggle{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;
          font-weight:600;color:var(--gold);background:#fff;border:1.5px solid var(--gold);
          border-radius:999px;padding:6px 15px;cursor:pointer;transition:background .15s}
  .toggle:hover{background:#faf4e8}
  .toggle .chev{font-size:11px;transition:transform .15s}
  .toggle.open .chev{transform:rotate(90deg)}
  .knownbody{display:none;margin-top:10px}
  .knownbody.open{display:block}
  .more{font-family:inherit;font-size:12px;font-weight:600;color:var(--gold);cursor:pointer;
        background:#fff;border:1.5px solid var(--gold);border-radius:999px;padding:3px 12px;
        margin-inline-start:8px;white-space:nowrap}
  .more:hover{background:#faf4e8}
  .kv i{font-style:normal;color:var(--ink3)}

  .note{background:#f7f0e0;border:1px solid #e6d3a8;border-radius:10px;padding:13px 16px;
        margin-top:16px;font-size:13.5px;color:#6b5318}
  .note b{color:#4f3d0f}
  .err{background:#fdf6f4;border:1px solid #dcbdb4;border-radius:10px;padding:13px 16px;
       margin-top:16px;font-size:13.5px;color:#8a2f1c}
  .ok{background:#f2f6ec;border:1px solid #cfdcc0;border-radius:10px;padding:13px 16px;
      margin-top:16px;font-size:13.5px;color:#46603a}
  /* An amber advisory: something is missing, but it does not stop the work. */
  .warn{background:#fbf3e6;border:1px solid #e3c489;border-radius:10px;padding:13px 16px;
        margin-top:16px;font-size:13.5px;color:#7a4f12}
  .warn b{color:#5c3a08}
  .gaplist{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
  .gaphead{font-size:12px;color:#8a6a33;margin-inline-end:2px}
  .gap{background:#fff;border:1px solid #e3c489;border-radius:999px;
       padding:3px 11px;font-size:12.5px;color:#7a4f12;white-space:nowrap}
  .gapnote{margin-top:10px;font-size:12.5px;color:#8a6a33}

  .cardsec{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden}
  .cardhead{display:flex;align-items:center;gap:12px;padding:15px 20px;cursor:pointer;user-select:none;
            border-bottom:1px solid transparent}
  .cardhead.open{border-bottom-color:var(--line)}
  .cardhead h3{margin:0;font-size:17px;font-weight:600;flex:1}
  .cardcount{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:3px 9px;border-radius:5px;
             background:#eef2e8;color:#47603a;white-space:nowrap}
  .cardcount.warn{background:#f6e2dd;color:#8a2f1c}
  .cardbody{display:none;padding:6px 20px 18px}
  .cardbody.open{display:block}
  .row{display:grid;grid-template-columns:minmax(150px,230px) 1fr auto;gap:14px;align-items:start;
       padding:11px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row.miss{background:#fdf9f4;margin:0 -12px;padding-inline:12px;border-radius:8px}
  .rlabel{font-size:14.5px;color:var(--ink2);padding-top:8px}
  .rlabel b{color:var(--ink);font-weight:600}
  .rval{font-size:15px;padding-top:8px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.6}
  .rside{display:flex;gap:6px;align-items:center;padding-top:6px}
  .editbtn{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--gold);background:#fff;
           border:1.5px solid var(--gold);border-radius:999px;padding:3px 12px;cursor:pointer;white-space:nowrap}
  .editbtn:hover{background:#faf4e8}
  .paywrap{overflow-x:auto;margin-top:6px}
  .paytable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
  .paytable th{text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
               color:var(--ink3);font-weight:500;padding:9px 10px;background:#faf8f3;
               border-bottom:1px solid var(--line2);white-space:nowrap}
  .paytable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .paytable th.payname{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
                       background:transparent;white-space:nowrap;border-bottom:1px solid var(--line)}
  .paytable tr:last-child td,.paytable tr:last-child th{border-bottom:none}
  .paytable td.cellmiss{background:#fdf9f4}
  .paytable .inp{padding:6px 9px;font-size:13.5px}
  .cellval{margin-inline-end:8px}
  .paytable td.cellpend{background:#f7f0e0}
  .pend{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;background:#f7f0e0;
        color:#8a6520;padding:3px 8px;border-radius:5px;white-space:nowrap}
  .editbtn.tiny{font-size:10.5px;padding:2px 9px}
  .calcbox{margin-top:7px;font-size:12.5px;color:var(--ink2);background:#faf8f3;
           border:1px solid var(--line2);border-radius:8px;padding:8px 11px;
           display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .calcbox.ok{background:#f2f6ec;border-color:#cfdcc0;color:#46603a}
  .calcbox.bad{background:#fdf6f4;border-color:#dcbdb4;color:#8a2f1c}
  .calcf{font-family:var(--mono);font-size:11.5px;direction:ltr;color:var(--ink3)}
  .calcbox.bad .calcf{color:#a5665a}
  .calcwarn{flex-basis:100%;font-weight:600}
  .paysum th{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink);background:#faf8f3}
  .paysum td{background:#faf8f3;font-size:13.5px}
  .checkline2{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin-top:14px;
              padding-top:12px;border-top:1px solid var(--line)}
  .chk{display:inline-flex;gap:6px;align-items:center}
  .chk.ok{color:var(--green)} .chk.bad{color:var(--red);font-weight:600}
  .resline{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-top:7px;font-size:13px}
  .resboard{font-family:var(--mono);font-size:9px;letter-spacing:.06em;background:#e6eef5;color:#2f5474;
            padding:2px 7px;border-radius:4px}
  .resdiff{font-family:var(--mono);font-size:11.5px;color:var(--ink3);direction:ltr}
  .resdiff s{color:#a5665a}
  .resreason{color:#8a2f1c}
  .hidden{display:none}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);
        border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none">LAW<span>LY</span></a></div>
    <div class="who"><span id="userName">—</span> · <span id="userRole">—</span>
      <button id="toPortal" style="margin-inline-start:12px;background:none;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-family:inherit;font-size:11px;color:var(--ink2);cursor:pointer">← לפורטל</button></div>
  </header>

  <!-- ========== 1. deal picker ========== -->
  <section id="view-pick">
    <h1>הפקת סינופסיס</h1>
    <p class="sub">בחרי את העסקה. כל השאר נמשך אוטומטית ממנדיי.</p>
    <div class="card">
      <label class="fl">שם העסקה</label>
      <input class="inp" id="q" autocomplete="off" placeholder="התחילי להקליד…">
      <div class="results hidden" id="results"></div>
      <div class="btnrow"><button class="btn" id="go" disabled>התחל</button>
        <span class="hint" id="pickHint">בחרי עסקה מהרשימה</span></div>
    </div>
  </section>

  <!-- ========== 2. loading ========== -->
  <section id="view-load" class="hidden">
    <h1 id="loadDeal">—</h1>
    <p class="sub">מושך את כל מה שידוע במנדיי…</p>
    <div class="card">
      <div class="bar"><span id="bar"></span></div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <!-- ========== 3. gaps ========== -->
  <section id="view-miss" class="hidden">
    <h1>נתוני העסקה</h1>
    <p class="sub" id="missSub">—</p>

    <div class="card">
      <div class="summary" style="border-top:none;margin-top:0;padding-top:0">
        <div class="stat"><b id="sFilled">—</b><span>מלאים במנדיי</span></div>
        <div class="stat warn"><b id="sEmpty">—</b><span>חסרים</span></div>
        <div class="stat warn"><b id="sReq">—</b><span>חובה</span></div>
        <div class="stat"><b id="sTotal">—</b><span>סה״כ שדות</span></div>
      </div>
      <div id="checks"></div>
    </div>

    <form id="missForm"><div id="cards"></div>
      <div class="note"><b>מה שתמלאי או תערכי כאן נשמר למנדיי</b> על שמך, לכרטיס שבו השדה באמת יושב.</div>
      <div id="msg"></div>
      <div class="btnrow">
        <button type="submit" class="btn gold" id="save">שמור למנדיי והמשך</button>
        <button type="button" class="btn ghost" id="back">חזרה</button>
      </div>
    </form>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);

/* Session travels in the httpOnly portal_session cookie — same as settings.html. */
function denied(msg) {
  document.querySelector('.wrap').innerHTML =
    '<div class="card" style="margin-top:40px"><div style="font-size:20px;font-weight:600;margin-bottom:6px">אין הרשאה</div>' +
    '<p style="color:var(--ink2);margin:0 0 16px">' + msg + '</p>' +
    '<button class="btn ghost" onclick="location.href=\'/\'">← חזרה לפורטל</button></div>';
}
const REQUEST_TIMEOUT_MS = 120000;

async function jget(url) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
  let r;
  try {
    r = await fetch(url, { credentials: 'include', signal: ctl.signal });
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? 'הבקשה נתקעה ובוטלה אחרי ' + Math.round(REQUEST_TIMEOUT_MS / 1000) + ' שניות.'
      : 'החיבור לשרת נכשל. בדקי את חיבור האינטרנט.');
  } finally {
    clearTimeout(timer);
  }
  if (r.status === 401) { location.href = '/'; throw new Error('not signed in'); }
  if (r.status === 403) { const j = await r.json().catch(() => ({}));
    denied(j.error || 'התפקיד שלך אינו מאפשר גישה ללוחות מנדיי. פנה למנהל המערכת.');
    throw new Error('forbidden'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('השרת החזיר שגיאה ' + r.status + '.'));
  return j;
}
// Every call is bounded and every non-2xx becomes a thrown Error carrying the
// server's own message. Before this, a 500/403/429 was parsed as if it had
// succeeded, and a stalled request never settled at all - which is how a save
// could leave the page spinning forever with nothing written to any log.
async function jpost(url, body) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
  let r;
  try {
    r = await fetch(url, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      signal: ctl.signal
    });
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? 'הבקשה נתקעה ובוטלה אחרי ' + Math.round(REQUEST_TIMEOUT_MS / 1000) + ' שניות.'
      : 'החיבור לשרת נכשל. בדקי את חיבור האינטרנט.');
  } finally {
    clearTimeout(timer);
  }

  if (r.status === 401) { location.href = '/'; throw new Error('not signed in'); }
  if (r.status === 403) {
    const j = await r.json().catch(() => ({}));
    denied(j.error || 'התפקיד שלך אינו מאפשר את הפעולה הזו. פנה למנהל המערכת.');
    throw new Error('forbidden');
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('השרת החזיר שגיאה ' + r.status + '.'));
  return j;
}
let picked = null, run = null;

/* ---------- 1. picker ---------- */
let t;
$('#q').addEventListener('input', e => {
  clearTimeout(t); picked = null; $('#go').disabled = true;
  const q = e.target.value.trim();
  if (q.length < 2) { $('#results').classList.add('hidden'); return; }
  t = setTimeout(async () => {
    const r = await jget('/api/synopsis/deals?q=' + encodeURIComponent(q));
    const box = $('#results');
    if (!r.deals || !r.deals.length) {
      box.innerHTML = '<div class="res" style="cursor:default;color:var(--ink3)">לא נמצאה עסקה בשם הזה</div>';
    } else {
      box.innerHTML = r.deals.map(d =>
        `<div class="res" data-id="${d.id}" data-board="${d.boardId}" data-name="${d.name}">
           <span>${d.name}</span><span class="bd">${d.boardName}</span></div>`).join('');
      box.querySelectorAll('.res[data-id]').forEach(el => el.onclick = () => {
        picked = { id: el.dataset.id, boardId: el.dataset.board, name: el.dataset.name };
        $('#q').value = picked.name; box.classList.add('hidden');
        $('#go').disabled = false; $('#pickHint').textContent = 'מוכן';
      });
    }
    box.classList.remove('hidden');
  }, 200);
});

/* ---------- 2. loading ---------- */
const LOAD_STEPS = [
  ['רשומת העסקה', 'לידים / עסקאות קבלן'],
  ['רשומת הלקוח', 'לקוחות'],
  ['רשומת הפרויקט', 'פרוייקטים'],
  ['לוח התשלומים', 'תשלומים'],
  ['בדיקת שדות מול מפת העמודות', 'column map']
];

$('#go').onclick = async () => {
  show('load'); $('#loadDeal').textContent = picked.name;
  $('#steps').innerHTML = LOAD_STEPS.map((s, i) =>
    `<div class="step" id="st${i}"><span class="tick">◌</span><span>${s[0]}</span><span class="meta">${s[1]}</span></div>`).join('');
  let i = 0;
  const tick = setInterval(() => {
    if (i < LOAD_STEPS.length) { const el = $('#st' + i); el.querySelector('.tick').textContent = '✓';
      el.querySelector('.tick').classList.add('ok'); i++; $('#bar').style.width = (i / LOAD_STEPS.length * 100) + '%'; }
  }, 260);

  try {
    const r = await jpost('/api/synopsis/facts', { dealId: picked.id, boardId: picked.boardId });
    if (r.error) throw new Error(r.error);
    run = r;
    setTimeout(() => { clearInterval(tick); $('#bar').style.width = '100%'; renderMissing(r); show('miss'); },
      Math.max(0, LOAD_STEPS.length * 280 - 400));
  } catch (e) {
    clearInterval(tick);
    $('#steps').insertAdjacentHTML('beforeend',
      `<div class="step"><span class="tick no">✕</span><span>${e.message}</span></div>`);
  }
};

/* ---------- 3. every field the synopsis needs, by card ---------- */

/* Board values + what has been typed. Conditions read the combination, so
   answering a question reveals what it unlocks without saving first. The server
   stays authoritative: on save it recomputes from monday. */
function isBlank(v) {
  if (v === null || v === undefined) return true;
  const t = String(v).trim();
  return t === '' || t === '-' || t === 'N/A' || t === 'n/a';
}
function condHolds(c, vals) {
  if (c.anyOf) return c.anyOf.some(x => condHolds(x, vals));
  const other = vals[c.field];
  if (c.empty) return isBlank(other);
  if (c.notEmpty) return !isBlank(other);
  return !isBlank(other) && String(other).trim() === c.equals;
}
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* Only money gets thousand separators. An ID, a phone, a גוש or a ח.פ. is a
   string of digits, not a quantity — 972,532,744,740 is not a phone number. */
const MONEY = new Set(['purchase_price','attorney_fee_incl_vat','broker_fee_incl_vat',
  'purchase_tax','purchase_tax_alt','company_lawyer_fee','payment_amount']);
const fmtNum = (v, key) => (MONEY.has(key) || /סכום|מחיר|תמורה|שכ"ט|מס$/.test(String(key || '')))
  && /^-?\d+(\.\d+)?$/.test(String(v))
  ? Number(v).toLocaleString('en-US') : v;

let ALL = [], BOARD = {}, DRAFT = {}, PAYMENTS = [], CHECKS = {}, EDITING = {}, OPEN = {}, MISMATCH = [];

/* What a field holds right now: what you typed if you have typed, else the board.
   Re-rendering must never lose an entry — the form redraws whenever an answer
   unlocks another field, and that can happen while you are half way through. */
const current = (key, boardValue) => (DRAFT[key] !== undefined ? DRAFT[key] : boardValue);

const CARDS = [
  { owner: 'deal',     title: 'העסקה' },
  { owner: 'client',   title: 'כרטיס הלקוח' },
  { owner: 'client2',  title: 'כרטיס לקוח 2' },
  { owner: 'project',  title: 'כרטיס הפרויקט' },
  { owner: 'payments', title: 'לוח תשלומים' }
];

function shownFields() {
  const eff = Object.assign({}, BOARD, DRAFT);
  return ALL.filter(f => f.ask !== false && (!f.showIf || condHolds(f.showIf, eff)));
}

/* one input, typed by the OWNING column */
function inputFor(f, value) {
  const t = f.inputType || f.type;
  const v = value == null ? '' : String(value);
  if (f.ui === 'relation')
    return `<div class="rel" data-key="${f.key}" data-board="${f.lookupBoard}">
      <input class="inp rel-q" autocomplete="off" placeholder="חיפוש ב${esc(f.ownerBoard)}…" value="${esc(v)}">
      <input type="hidden" name="${f.key}"><div class="results hidden rel-res"></div></div>`;
  if (t === 'file') return `<input class="inp" type="file" disabled>`;
  if (f.options && f.options.length)
    return `<select class="inp" name="${f.key}"><option value="">—</option>` +
      f.options.map(o => `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('') +
      '</select>';
  if (t === 'date')     return `<input class="inp" type="date" name="${f.key}" value="${esc(v)}">`;
  if (t === 'numbers')  return `<input class="inp" type="number" step="any" name="${f.key}" value="${esc(v)}" placeholder="—">`;
  if (f.ui === 'textarea' || t === 'long_text')
    return `<textarea class="inp big" rows="7" name="${f.key}" placeholder="—">${esc(v)}</textarea>`;
  if (t === 'email')    return `<input class="inp" type="email" name="${f.key}" value="${esc(v)}" style="direction:ltr;text-align:right">`;
  if (t === 'phone')    return `<input class="inp" type="tel" name="${f.key}" value="${esc(v)}" style="direction:ltr;text-align:right">`;
  return `<input class="inp" type="text" name="${f.key}" value="${esc(v)}" placeholder="—">`;
}

function hintFor(f) {
  if (f.blockedReason) return `<div class="hint mirror">${esc(f.blockedReason)} — יש לקשר קודם.</div>`;
  if (f.controlsBlock) return `<div class="hint">קובע אם ${esc(f.controlsBlock)} נכנס למכתב</div>`;
  if (f.derived)       return `<div class="hint">מחושב: ${esc(f.derived)}</div>`;
  if (f.note)          return `<div class="hint">${esc(f.note)}</div>`;
  return '';
}

/* one line: label · value or input · edit */
function rowFor(f, boardValue) {
  // Empty is decided by the BOARD, not by what has been typed. Otherwise the
  // moment you type, the field would count as filled and turn back into text.
  const emptyOnBoard = isBlank(boardValue);
  const value = current(f.key, boardValue);
  const editing = EDITING[f.key];
  const req = f.required ? '<span class="req">חובה</span>' : '';
  const cannot = f.blockedReason || !f.writable;

  const calc = f.computedFormula ? {
    value: f.computedValue, formula: f.computedFormula, agrees: f.computedAgrees
  } : null;

  let mid, side = '', calcLine = '';
  if (calc) {
    if (calc.agrees === false) {
      calcLine = `<div class="calcbox bad"><b>החישוב נותן ${esc(fmtNum(calc.value, f.key))}</b>
        <span class="calcf">${esc(calc.formula)}</span>
        <div class="calcwarn">סתירה — במנדיי רשום ${esc(fmtNum(boardValue, f.key))}. בדקי מה נכון וערכי אם צריך.</div></div>`;
    } else if (calc.agrees === true) {
      calcLine = `<div class="calcbox ok">✓ תואם את החישוב <span class="calcf">${esc(calc.formula)}</span></div>`;
    } else {
      calcLine = `<div class="calcbox"><b>לפי החישוב: ${esc(fmtNum(calc.value, f.key))}</b>
        <span class="calcf">${esc(calc.formula)}</span>
        <button type="button" class="editbtn tiny" data-usecalc="${f.key}" data-val="${esc(calc.value)}">השתמש בחישוב</button></div>`;
    }
  }

  if (cannot) {
    mid = emptyOnBoard ? `<div class="rval" style="color:var(--ink3)">—</div>`
                       : `<div class="rval">${esc(fmtNum(boardValue, f.key))}</div>`;
  } else if (emptyOnBoard || editing) {
    mid = inputFor(f, value);                       // keeps what you typed
    if (editing) side = `<button type="button" class="editbtn" data-cancel="${f.key}">ביטול</button>`;
    else if (!isBlank(value)) side = `<span class="pend">ייכתב בשמירה</span>`;
  } else {
    mid = `<div class="rval">${esc(fmtNum(boardValue, f.key))}</div>`;
    side = `<button type="button" class="editbtn" data-edit="${f.key}">ערוך</button>`;
  }
  return `<div class="row${(emptyOnBoard && !cannot && isBlank(value)) || calc?.agrees === false ? ' miss' : ''}">
      <div class="rlabel"><b>${esc(f.label)}</b>${req}</div>
      <div>${mid}${calcLine}${hintFor(f)}</div>
      <div class="rside">${side}</div></div>`;
}

function paymentBody() {
  if (!PAYMENTS.length) return '<p class="hint">אין תשלומי דירה מקושרים לעסקה.</p>';
  const cols = PAYMENTS[0].cells.map(c => c.label);
  const head = '<tr><th>תשלום</th>' + cols.slice(1).map(l => `<th>${esc(l)}</th>`).join('') + '</tr>';

  const body = PAYMENTS.map(p => {
    const first = p.cells[0];
    const tds = p.cells.slice(1).map(c => {
      const f = { ...c, ownerBoard: 'תשלומים', key: c.key };
      const val = current(c.key, c.value);
      if (!c.writable) return `<td>${esc(fmtNum(c.value, c.label))}</td>`;
      if (isBlank(c.value) || EDITING[c.key])
        return `<td class="${isBlank(val) ? 'cellmiss' : 'cellpend'}">${inputFor(f, val)}</td>`;
      return `<td><span class="cellval">${esc(fmtNum(c.value, c.label))}</span>` +
             `<button type="button" class="editbtn tiny" data-edit="${c.key}">ערוך</button></td>`;
    }).join('');
    return `<tr><th class="payname">${esc(first.value || p.title)}</th>${tds}</tr>`;
  }).join('');

  const c = CHECKS || {};
  const foot = `<tr class="paysum"><th>סה״כ</th>
      <td><b>${fmtNum(c.sum || 0, 'purchase_price')}</b>
        <span class="chk ${c.sumOk ? 'ok' : 'bad'}">${c.sumOk ? '✓ = מחיר הדירה' : '✕ ≠ ' + fmtNum(c.price || 0, 'purchase_price')}</span></td>
      <td><b>${c.pct || 0}%</b>
        <span class="chk ${c.pctOk ? 'ok' : 'bad'}">${c.pctOk ? '✓' : '✕'}</span></td>
      <td colspan="3"></td></tr>`;

  return `<div class="paywrap"><table class="paytable">
      <thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>
    <p class="hint" style="margin-top:10px">נלקחות רק שורות מקבוצת <b>תשלומי דירה</b>.
      שכר טרחה והוצאות נמצאים באותו לוח בקבוצות אחרות ואינם חלק מלוח התשלומים במכתב.</p>`;
}

function renderCards() {
  const eff = Object.assign({}, BOARD, DRAFT);
  const shown = shownFields();
  const html = CARDS.map(card => {
    let body, total, missCount, reqCount;
    if (card.owner === 'payments') {
      const cells = PAYMENTS.flatMap(p => p.cells);
      total = cells.length;
      if (!total) return '';
      missCount = cells.filter(c => isBlank(current(c.key, c.value)) && c.writable).length;
      reqCount  = cells.filter(c => isBlank(current(c.key, c.value)) && c.required && c.writable).length;
      body = paymentBody();
    } else {
      const mine = shown.filter(f => f.owner === card.owner);
      if (!mine.length) return '';
      total = mine.length;
      const stillBlank = f => isBlank(current(f.key, BOARD[f.key]));
      missCount = mine.filter(f => stillBlank(f) && f.writable && !f.blockedReason).length;
      reqCount  = mine.filter(f => stillBlank(f) && f.required && f.writable && !f.blockedReason).length;
      body = mine
        .sort((a, b) => (isBlank(BOARD[b.key]) - isBlank(BOARD[a.key])) || (b.required - a.required))
        .map(f => rowFor(f, BOARD[f.key])).join('');
    }
    const open = OPEN[card.owner] !== undefined ? OPEN[card.owner] : reqCount > 0;
    OPEN[card.owner] = open;
    const badge = missCount
      ? `<span class="cardcount warn">${missCount} חסרים${reqCount ? ` · ${reqCount} חובה` : ''}</span>`
      : `<span class="cardcount">מלא</span>`;
    return `<div class="cardsec">
      <div class="cardhead${open ? ' open' : ''}" data-card="${card.owner}">
        <button type="button" class="toggle${open ? ' open' : ''}" tabindex="-1">
          <span class="chev">▸</span><span>${open ? 'הסתר' : 'הצג'}</span></button>
        <h3>${card.title}</h3>
        <span class="cardcount">${total} שדות</span>${badge}
      </div>
      <div class="cardbody${open ? ' open' : ''}">${body}</div>
    </div>`;
  }).join('');
  $('#cards').innerHTML = html;

  document.querySelectorAll('.cardhead').forEach(h => h.onclick = () => {
    OPEN[h.dataset.card] = !OPEN[h.dataset.card]; renderCards();
  });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    EDITING[b.dataset.edit] = true; renderCards();
  });
  document.querySelectorAll('[data-usecalc]').forEach(b => b.onclick = () => {
    const k = b.dataset.usecalc;
    DRAFT[k] = b.dataset.val; EDITING[k] = true; renderCards();
    const el = document.querySelector(`[name="${k}"]`);
    if (el) { el.value = b.dataset.val; el.focus(); }
  });
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    delete EDITING[b.dataset.cancel]; delete DRAFT[b.dataset.cancel]; renderCards();
  });
  wireRelations($('#cards'));

  const blank = (k, v) => isBlank(current(k, v));
  const missTotal = shown.filter(f => blank(f.key, BOARD[f.key]) && f.writable && !f.blockedReason).length +
                    PAYMENTS.flatMap(p => p.cells).filter(c => blank(c.key, c.value) && c.writable).length;
  const reqTotal  = shown.filter(f => blank(f.key, BOARD[f.key]) && f.required && f.writable && !f.blockedReason).length +
                    PAYMENTS.flatMap(p => p.cells).filter(c => blank(c.key, c.value) && c.required && c.writable).length;
  $('#sEmpty').textContent = missTotal;
  $('#sReq').textContent = reqTotal;
}

function readDraft() {
  const form = document.getElementById('missForm');
  if (!form) return;
  form.querySelectorAll('[name]').forEach(el => { DRAFT[el.name] = el.value; });
}

/* a change can unlock another field — re-render only when the visible set moves */
// Keep the draft current on every keystroke. Re-rendering rebuilds the inputs,
// so anything not captured here would be lost the moment another answer changes
// what is on screen — or when a card is collapsed.
document.addEventListener('input', ev => {
  const el = ev.target;
  if (!el.name || !el.closest || !el.closest('#missForm')) return;
  DRAFT[el.name] = el.value;
});
document.addEventListener('change', ev => {
  if (!ev.target.closest || !ev.target.closest('#missForm')) return;
  const before = shownFields().map(f => f.key).join(',');
  readDraft();
  if (shownFields().map(f => f.key).join(',') !== before) renderCards();
});

/* Link picker for board_relation fields — searches the owning board by name. */
function wireRelations(root) {
  root.querySelectorAll('.rel').forEach(box => {
    const q = box.querySelector('.rel-q'), hidden = box.querySelector('input[type=hidden]'),
          res = box.querySelector('.rel-res');
    let timer;
    q.addEventListener('input', () => {
      clearTimeout(timer); hidden.value = '';
      const term = q.value.trim();
      if (term.length < 2) { res.classList.add('hidden'); return; }
      timer = setTimeout(async () => {
        const r = await jget(`/api/synopsis/lookup?board=${box.dataset.board}&q=${encodeURIComponent(term)}`);
        res.innerHTML = (r.items || []).length
          ? r.items.map(i => `<div class="res" data-id="${i.id}">${esc(i.name)}</div>`).join('')
          : '<div class="res" style="cursor:default;color:var(--ink3)">לא נמצא</div>';
        res.querySelectorAll('.res[data-id]').forEach(el => el.onclick = () => {
          hidden.value = el.dataset.id; q.value = el.textContent;
          res.classList.add('hidden'); q.classList.add('picked');
          readDraft(); DRAFT[hidden.name] = el.dataset.id; renderCards();
        });
        res.classList.remove('hidden');
      }, 200);
    });
  });
}

function renderMissing(r) {
  $('#missSub').textContent = `${r.deal.name} · ${r.deal.board}`;
  ALL = r.fields || []; BOARD = r.values || {};
  PAYMENTS = r.payments || []; CHECKS = r.checks || {}; MISMATCH = r.mismatches || [];
  DRAFT = {}; EDITING = {}; OPEN = {};
  $('#sFilled').textContent = r.counts.filled;
  $('#sTotal').textContent = r.counts.total;
  const c = CHECKS;
  $('#checks').innerHTML = PAYMENTS.length ? `<div class="checkline2">
      <span class="chk ${c.sumOk ? 'ok' : 'bad'}">${c.sumOk ? '✓' : '✕'} תשלומים = מחיר הדירה</span>
      <span class="chk ${c.pctOk ? 'ok' : 'bad'}">${c.pctOk ? '✓' : '✕'} אחוזים = 100</span>
    </div>` : '';
  renderCards();
}

// The continue button. Missing required fields are a WARNING, never a gate:
// a synopsis often has to be drafted before every last detail is on the board,
// and the paralegal is the one who decides whether a gap matters. What is still
// empty is carried forward to the build page so it stays visible there.
function continueBtn() {
  const gaps = shownFields().filter(f => f.required && isBlank(current(f.key, BOARD[f.key])));
  const q = 'dealId=' + encodeURIComponent(run.deal.id) +
            (gaps.length ? '&missing=' + encodeURIComponent(gaps.length) : '');
  return `<div class="btnrow"><button type="button" class="btn gold" ` +
         `onclick="location.href='/synopsis-build.html?${q}'">המשך לבניית הסינופסיס ←</button></div>`;
}

$('#missForm').onsubmit = async ev => {
  ev.preventDefault();
  const values = {};
  // Send everything that has a value. The server compares against what monday
  // actually holds right now and reports back what it wrote, what it refused and
  // what was already identical — rather than this page deciding silently.
  new FormData(ev.target).forEach((v, k) => {
    const t = String(v).trim();
    if (t) values[k] = t;
  });

  // Emptying a value is an UPDATE — the field is being set to nothing, the same
  // way it would be set to anything else. Until now a cleared box simply vanished
  // from the form data and the page announced "nothing to update", so a
  // deliberate change was discarded AND reported as success.
  // It is only sent when the board actually holds something there and the
  // paralegal typed it away, so an untouched empty field is never sent.
  const clear = Object.keys(DRAFT).filter(k =>
    String(DRAFT[k] ?? '').trim() === '' && !isBlank(BOARD[k]));

  if (!Object.keys(values).length && !clear.length) {
    $('#msg').innerHTML = '<div class="ok"><b>אין מה לעדכן — לא שינית שום שדה.</b></div>' + continueBtn();
    $('#save').disabled = false; $('#save').textContent = 'שמור למנדיי והמשך';
    return;
  }

  if (clear.length) {
    const names = clear.map(k => (ALL.find(f => f.key === k) || {}).label || k);
    if (!confirm('השדות הבאים יתרוקנו במונדיי (הערך הקיים יוחלף בריק):\n\n· ' +
                 names.join('\n· ') + '\n\nלהמשיך?')) {
      $('#save').disabled = false;
      $('#msg').innerHTML = '';
      return;
    }
  }

  $('#save').disabled = true;
  $('#msg').innerHTML = '<div class="note"><span class="spin"></span> שומר…</div>';

  // Everything from here to the finally block is wrapped. Any failure - a
  // dropped connection, a server error, a timeout - now ends in a message on
  // screen and a working button, instead of a spinner that can never stop.
  try {
  const r = await jpost('/api/synopsis/fill', { dealId: run.deal.id, runId: run.runId, values, clear });

  const line = x => `<div class="resline"><b>${esc(x.label || x.fieldKey)}</b>` +
    (x.board ? `<span class="resboard">${esc(x.board)}</span>` : '') +
    (x.before !== undefined && x.before !== null && String(x.before).trim() !== ''
      ? `<span class="resdiff"><s>${esc(x.before)}</s> ← ${esc(x.after) || '<i>(ריק)</i>'}</span>`
      : (x.after !== undefined ? `<span class="resdiff">${esc(x.after)}</span>` : '')) +
    (x.reason ? `<span class="resreason">${esc(x.reason)}</span>` : '') + '</div>';

  let html = '';
  if ((r.written || []).length) html +=
    `<div class="ok"><b>נשמרו ${r.written.length} שדות למנדיי</b>` +
    (r.readOnlyMode ? ' <b>(מצב קריאה בלבד — לא נשלח)</b>' : '') +
    r.written.map(line).join('') + '</div>';

  if ((r.cleared || []).length) html +=
    `<div class="ok"><b>רוקנו ${r.cleared.length} שדות במונדיי</b>` +
    r.cleared.map(line).join('') + '</div>';

  if (r.unchanged && r.unchanged.length) html +=
    `<div class="note"><b>${r.unchanged.length} שדות לא נשלחו — הערך זהה למה שכבר רשום במנדיי</b>` +
    r.unchanged.map(line).join('') + '</div>';

  if ((r.rejected || []).length) html +=
    `<div class="err"><b>לא נשמרו</b>` + r.rejected.map(line).join('') + '</div>';

  const blockedBy = r.blockedBy || [];
  const openHere  = blockedBy.filter(b => b.writable);
  const openThere = blockedBy.filter(b => !b.writable);

  if (!blockedBy.length) {
    html += '<div class="ok"><b>הלוח מעודכן. כל שדות החובה מלאים.</b><br>' +
      'מכאן השלב הבא הוא: קריאת הסינופסיס של הלקוח הקודם בפרויקט, החלטה מה צריך להשתנות, ' +
      'הצגת השינויים לאישורך, ורק אחר כך בניית הקובץ.</div>';
  } else {
    // A warning, not a wall. The button below stays live either way.
    html += '<div class="warn"><b>שדות חובה שעדיין ריקים — אפשר להמשיך בלעדיהם:</b>' +
      (openHere.length ? '<div class="gaplist">' +
        openHere.map(b => `<span class="gap">${esc(b.label)}</span>`).join('') + '</div>' : '') +
      (openThere.length ? '<div class="gaplist"><span class="gaphead">מלוחות אחרים:</span>' +
        openThere.map(b => `<span class="gap">${esc(b.label)} · ${esc(b.board)}</span>`).join('') + '</div>' : '') +
      '<div class="gapnote">הסינופסיס ייבנה בלי הערכים האלה, והם יסומנו כחסרים בשלב הבא.</div></div>';
  }
  html += continueBtn();
  $('#msg').innerHTML = html;

  // Re-read the deal so the cards show what monday now holds. A write that did
  // not land is then visible on screen, instead of being taken on trust.
  try {
    const fresh = await jpost('/api/synopsis/facts', { dealId: run.deal.id, boardId: run.deal.boardId });
    if (!fresh.error) { run = fresh; renderMissing(fresh); $('#msg').innerHTML = html; }
  } catch (e) { /* the message above still stands */ }

  } catch (e) {
    if (e.message === 'forbidden' || e.message === 'not signed in') return;
    $('#msg').innerHTML =
      '<div class="err"><b>השמירה נכשלה.</b><br>' + esc(e.message) + '<br>' +
      'ייתכן שחלק מהשדות כן נשמרו לפני התקלה — רענני את הדף ובדקי מה נכנס בפועל לפני ניסיון נוסף.</div>';
  } finally {
    $('#save').disabled = false;
    $('#save').textContent = 'שמור למנדיי והמשך';
  }
};

$('#back').onclick = () => show('pick');
document.getElementById('toPortal')?.addEventListener('click', () => location.href = '/');
function show(v) { for (const n of ['pick','load','miss'])
  document.getElementById('view-' + n).classList.toggle('hidden', n !== v); }

jget('/api/me').then(h => {
  $('#userName').textContent = h.name || h.email || '';
  $('#userRole').textContent = (h.roles || []).join(', ');
}).catch(() => {});
</script>
</body>
</html>
