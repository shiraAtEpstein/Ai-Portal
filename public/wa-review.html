<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תשובות WhatsApp — Lawly</title>
<!--
  wa-review.html — the WhatsApp responder's review screen.

  Shows what the agent (whatsapp/agent/pipeline.js) generated for real recent
  client messages: the chat, the client's message, the draft (editable), and —
  once it exists — the reply a staff member actually sent. A copy button puts
  the (possibly hand-edited) draft on the clipboard; nothing here sends
  anything or writes back to WhatsApp. Editing the text box only changes what
  gets copied — it is not saved.

  Visual language matches the "Lawly WhatsApp Drafts" design Shira supplied:
  warm cream ground, Frank Ruhl Libre for headings, Assistant for body/UI.

  PERMISSIONS: admin sees every chat's drafts; everyone else sees only chats
  routed to them (routes/wa-review.js, reusing the same buildBoard() the
  unanswered board and staff-response dashboard use for "who is this assigned to").
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F2EA; --ink:#14120F; --ink2:#2A261F; --muted:#6E6656; --mutedLight:#9A9078;
    --border:#E4DCCC; --borderStrong:#D5CBB6; --dashedBorder:#DED4BF;
    --cardHead:#F1EDE3; --cardBody:#FFFDF8; --quoteBg:#F4F0E6;
    --green:#3B6B4A; --gold:#8A6A2F; --red:#A6432E;
    --greenBg:#FFFDF8; --goldBg:#FFFDF8; --redBg:#FFFDF8;
    --serif:"Frank Ruhl Libre",Georgia,serif; --sans:Assistant,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);direction:rtl;}
  .wrap{max-width:1320px;margin:0 auto;padding:36px 22px 90px;}

  .toolRow{display:flex;justify-content:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .toolRow button{border:0;background:none;color:var(--mutedLight);font:12px var(--sans);cursor:pointer;padding:2px 0;}
  .toolRow button:hover{color:var(--muted);}
  .toolRow button:disabled{opacity:.5;cursor:default;}

  .header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;margin-bottom:22px;}
  .titleBlock{text-align:right;}
  h1{font-family:var(--serif);font-weight:400;font-size:27px;margin:0;color:var(--ink);}
  .subtitle{font-size:14px;color:var(--muted);margin-top:6px;}

  .tabRow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .tab{border:0;background:none;font:600 14.5px var(--sans);color:var(--mutedLight);cursor:pointer;padding-bottom:2px;border-bottom:1px solid transparent;font-weight:400;}
  .tab.on{color:var(--ink);font-weight:600;border-bottom:1px solid var(--gold);}

  .searchBox{border:1px solid var(--border);background:#FFFDF8;border-radius:20px;padding:8px 16px;font:14px var(--sans);color:var(--ink);min-width:220px;direction:rtl;}
  .searchBox:focus{outline:none;border-color:var(--gold);}
  .searchBox::placeholder{color:var(--mutedLight);}

  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;align-items:start;}
  .card{background:var(--cardBody);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .chead{background:var(--cardHead);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .badge{display:inline-flex;align-items:center;border:1px solid var(--border);background:#FFFDF8;border-radius:20px;padding:4px 12px;font:600 12.5px var(--sans);white-space:nowrap;}
  .badge.ready{color:var(--green);}
  .badge.human{color:var(--gold);}
  .badge.blocked{color:var(--red);}
  .chead .right{text-align:right;}
  .dealName{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);}
  .metaLine{font-size:13px;color:var(--muted);margin-top:3px;}

  .cbody{padding:18px 20px 20px;}
  .section{margin-top:2px;}
  .section + .section{margin-top:16px;}
  .lbl{display:flex;justify-content:space-between;align-items:baseline;font:600 12px var(--sans);letter-spacing:1.2px;color:var(--muted);margin-bottom:8px;}
  .lbl .hint{font:400 12px var(--sans);letter-spacing:normal;color:var(--mutedLight);cursor:default;}
  .lbl .hint.link{cursor:pointer;text-decoration:underline;}
  .lbl .hint.link:hover{color:var(--muted);}

  /* Bold border on the boxes that actually hold a message's content (the
     client's message, the response you'd copy, the "what was really sent"
     reference) so each one reads as a clearly separate block at a glance —
     as opposed to structural/decorative boxes (card shell, hint rows) which
     stay on the thin border. */
  .quoteBox{background:var(--quoteBg);border:2px solid var(--borderStrong);border-radius:10px;padding:13px 15px;font-size:15px;line-height:1.55;color:var(--ink2);white-space:pre-wrap;}
  .quoteTime{font-size:12px;color:var(--mutedLight);margin-top:8px;}

  textarea.draftBox{width:100%;min-height:88px;resize:vertical;background:#FFFFFF;border:2px solid var(--borderStrong);border-radius:10px;padding:13px 15px;font:15px/1.55 var(--sans);color:var(--ink2);}
  textarea.draftBox:focus{outline:none;border-color:var(--gold);}

  .draftFoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:10px;}
  .draftFoot .left{display:flex;align-items:center;gap:14px;}
  .linkBtn{border:0;background:none;color:var(--mutedLight);font:14px var(--sans);cursor:pointer;padding:0;}
  .linkBtn:hover{color:var(--muted);}
  .linkBtn:disabled{opacity:.5;cursor:default;}
  .btnPrimary{border:0;background:var(--ink);color:#FDFBF6;border-radius:8px;padding:10px 20px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap;}
  .btnPrimary:disabled{opacity:.55;cursor:default;}
  .code{font-size:11px;color:var(--mutedLight);}

  .warnNote{margin-top:10px;font-size:12.5px;color:var(--red);background:#FBF2EF;border:1px solid #EAD2CB;border-radius:8px;padding:8px 12px;}

  .noDraftRow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    background:var(--bg);border:1px dashed var(--dashedBorder);border-radius:10px;padding:14px 16px;}
  .noDraftReason{font-size:14px;color:var(--muted);text-align:right;flex:1;min-width:220px;}
  .btnGhost{border:1px solid var(--borderStrong);background:#FFFDF8;color:var(--ink);border-radius:8px;padding:9px 16px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap;}
  .btnGhost:disabled{opacity:.55;cursor:default;}

  .linkHint{margin-top:12px;background:var(--bg);border:1px dashed var(--dashedBorder);border-radius:10px;padding:11px 15px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .linkHint .txt{line-height:1.6;}
  .linkHint button{border:1px solid var(--borderStrong);background:#FFFDF8;color:var(--ink);border-radius:6px;padding:6px 12px;font:600 12px var(--sans);cursor:pointer;white-space:nowrap;}

  .refWrap{margin-top:4px;}
  .refWrap .quoteBox{background:#F1F0FA;border-color:#C7C5E8;}

  .state{padding:60px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9;}
  .state a{color:var(--gold);}

  .bottomRow{display:flex;justify-content:flex-start;margin-top:8px;}

  @media (max-width: 900px){
    .cards{grid-template-columns:1fr;}
  }
  @media (max-width: 640px){
    .header{flex-direction:column;align-items:flex-start;}
    .titleBlock{text-align:right;width:100%;}
    .searchBox{min-width:0;width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolRow" id="toolRow" style="display:none">
    <button type="button" id="reconcileBtn">בדוק מה נשלח בפועל</button>
    <button type="button" id="refreshBtn">רענון ↻</button>
  </div>
  <div class="toolRow" id="toolRowStaff" style="display:none">
    <button type="button" id="refreshBtn2">רענון ↻</button>
  </div>

  <div class="header">
    <div class="titleBlock">
      <h1>WhatsApp תשובות</h1>
      <div class="subtitle" id="meta">טוען…</div>
    </div>
    <div class="tabRow" id="tabRow" style="display:none">
      <button class="tab on" data-t="ready" type="button">לאישור<span class="n" id="cntReady"></span></button>
      <button class="tab" data-t="waiting" type="button">ממתין<span class="n" id="cntWaiting"></span></button>
      <input type="search" id="searchBox" class="searchBox" placeholder="חיפוש לפי שם שיחה" autocomplete="off">
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="bottomRow" id="bottomRow" style="display:none">
    <button class="btnGhost" id="queueBtn" type="button">הכן טיוטות לשיחות ממתינות</button>
  </div>
</div>

<script>
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function esc(s){return String(s==null?'':s);}

function fmtMsgTime(iso){
  if(!iso) return '';
  try{
    var d=new Date(iso);
    return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}
// Relative "when" for a ready draft's card (mirrors the design's "מאתמול").
function relativeWhen(iso){
  if(!iso) return '';
  try{
    var d=new Date(iso), now=new Date();
    var startOfDay=function(x){ return new Date(x.getFullYear(),x.getMonth(),x.getDate()); };
    var days=Math.round((startOfDay(now)-startOfDay(d))/86400000);
    if(days<=0) return 'היום';
    if(days===1) return 'מאתמול';
    if(days<7) return 'לפני '+days+' ימים';
    return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
  }catch(e){ return ''; }
}

var activeTab='ready'; // 'ready' | 'waiting'
var lastData=null;
var searchQuery='';

/* ------------------------------------------------------------ sign-in --- */
var TRIED_KEY='waReviewAuthBounce';
function goSignIn(){
  var already=false;
  try{ already=sessionStorage.getItem(TRIED_KEY)==='1'; }catch(e){}
  if(already) return showSignInLink();
  try{ sessionStorage.setItem(TRIED_KEY,'1'); }catch(e){}
  var next=encodeURIComponent(location.pathname+location.search);
  fetch('/auth/google/status',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(j){ location.replace(j&&j.enabled?('/auth/google/start?next='+next):'/'); })
    .catch(function(){ location.replace('/'); });
}
function showSignInLink(){
  document.getElementById('meta').textContent='נדרשת התחברות';
  document.getElementById('cards').innerHTML='';
  document.getElementById('cards').appendChild(
    (function(){var d=el('div','state');d.innerHTML='יש להתחבר כדי לראות את המסך הזה.<br><a href="/">מעבר לעמוד ההתחברות</a>';return d;})()
  );
}
function clearAuthBounce(){ try{ sessionStorage.removeItem(TRIED_KEY); }catch(e){} }

/* --------------------------------------------------------------- cards --- */
// Three states, three badges — matches the design exactly:
//   ready   -> outcome 'draft' (validated, nothing pending) -> green "טיוטה מוכנה"
//   review  -> has draft text but needs a human eye first: 'blocked' (failed
//              validation) or 'escalate' with a suggested draft -> gold badge,
//              same tab as 'ready' (it has content to review), with a warning.
//   human   -> queued, genuinely nothing to copy yet -> gold "דורש טיפול אנושי",
//              dashed reason box + "כתוב טיוטה בכל זאת".
function badgeFor(d){
  if(d.outcome==='draft') return {cls:'ready', text:'טיוטה מוכנה'};
  if(d.outcome==='blocked') return {cls:'blocked', text:'נחסם אוטומטית — לבדיקה'};
  if(d.draftText) return {cls:'human', text:'טיוטה לבדיקה — הועבר לאדם'};
  return {cls:'human', text:'דורש טיפול אנושי'};
}

function regenerate(chatJid, btn, force){
  var orig=btn.textContent;
  btn.disabled=true; btn.textContent='מריץ…';
  var qs='chatJid='+encodeURIComponent(chatJid)+'&limit=1'+(force?'&force=true':'');
  fetch('/api/admin/wa-review/queue?'+qs,{method:'POST',credentials:'same-origin'})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(!res.ok){ btn.disabled=false; btn.textContent=orig; alert('נכשל: '+((res.j&&res.j.error)||'שגיאה')); return; }
      load();
    })
    .catch(function(){ btn.disabled=false; btn.textContent=orig; alert('נכשל להריץ.'); });
}

function renderCard(d){
  var card=el('div','card');

  /* ---- header band ---- */
  var head=el('div','chead');
  var bf=badgeFor(d);
  head.appendChild(el('span','badge '+bf.cls,bf.text));
  var right=el('div','right');
  right.appendChild(el('div','dealName',d.chatLabel||d.chatJid||'—'));
  var metaBits=[];
  if(d.clientName) metaBits.push(d.clientName);
  if(d.responsibleName) metaBits.push(d.responsibleName);
  if(d.draftText) metaBits.push(relativeWhen(d.createdAt));
  else if(d.waitedLabel) metaBits.push('ממתין '+d.waitedLabel);
  right.appendChild(el('div','metaLine',metaBits.filter(Boolean).join(' · ')));
  head.appendChild(right);
  card.appendChild(head);

  var body=el('div','cbody');

  if(!d.dealLinked && d.chatJid && d.chatJid.indexOf('@g.us')!==-1){
    var gid=d.chatJid.replace(/\D/g,'');
    var lh=el('div','linkHint');
    lh.appendChild(el('div','txt','לא מקושר לעסקה במאנדיי — כדי לקשר, הדביקו את המזהה הזה בעמודת מזהה הקבוצה בפריט המתאים בלוח קבלן/יד2.'));
    var cb=el('button',null,'העתק מזהה קבוצה');
    cb.type='button';
    cb.addEventListener('click',function(){
      var done=function(){ cb.textContent='הועתק ✓'; setTimeout(function(){cb.textContent='העתק מזהה קבוצה';},1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(gid).then(done).catch(done); }
      else { done(); }
    });
    lh.appendChild(cb);
    body.appendChild(lh);
  }

  /* ---- client message ---- */
  if(d.messageText){
    var sec1=el('div','section');
    sec1.appendChild(el('div','lbl',null));
    sec1.lastChild.appendChild(document.createTextNode('הודעת הלקוח'));
    var qbox=el('div','quoteBox');
    var qt=el('div');qt.setAttribute('dir','auto');qt.textContent=d.messageText;qbox.appendChild(qt);
    var qtime=fmtMsgTime(d.messageAt||d.createdAt);
    if(qtime) qbox.appendChild(el('div','quoteTime',qtime));
    sec1.appendChild(qbox);
    body.appendChild(sec1);
  }

  /* ---- caveat for an escalate-with-suggestion draft ---- */
  var reasonTxt=d.outcomeReasonLabel||d.outcomeReason||'';
  if(d.outcome==='escalate' && d.draftText){
    body.appendChild(el('div','warnNote','הועבר לאדם — '+(reasonTxt||'ללא סיבה מפורטת')+'. הטיוטה הבאה היא הצעה בלבד — יש לבדוק היטב לפני שימוש.'));
  } else if(d.outcome==='blocked'){
    body.appendChild(el('div','warnNote','נחסם אוטומטית: '+(reasonTxt||'')+' — יש לבדוק ידנית לפני שימוש.'));
  }

  /* ---- response: editable draft, or dashed "no draft yet" ---- */
  var sec2=el('div','section');
  var lbl2=el('div','lbl');
  if(d.draftText){
    var hint=el('span','hint','ניתן לעריכה');
    lbl2.appendChild(hint);
  } else {
    lbl2.appendChild(el('span','hint',''));
  }
  lbl2.appendChild(document.createTextNode('התשובה שלך'));
  sec2.appendChild(lbl2);

  if(d.draftText){
    var ta=document.createElement('textarea');
    ta.className='draftBox';
    ta.setAttribute('dir','auto');
    ta.value=d.draftText;
    sec2.appendChild(ta);

    var foot=el('div','draftFoot');
    var left=el('div','left');
    var regenBtn=el('button','linkBtn','נסח מחדש');
    regenBtn.type='button';
    regenBtn.addEventListener('click',function(){ regenerate(d.chatJid, regenBtn, true); });
    left.appendChild(regenBtn);
    left.appendChild(el('span','hint','העריכה נכנסת לתוקף למה שיועתק'));
    foot.appendChild(left);

    var copyBtn=el('button','btnPrimary','העתק תשובה');
    copyBtn.type='button';
    copyBtn.addEventListener('click',function(){
      var text=ta.value;
      var done=function(){ copyBtn.textContent='הועתק ✓'; setTimeout(function(){copyBtn.textContent='העתק תשובה';},1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(function(){ ta.select(); document.execCommand('copy'); done(); });
      } else { ta.select(); document.execCommand('copy'); done(); }
    });
    foot.appendChild(copyBtn);
    sec2.appendChild(foot);
    if(d.answerBankCode) sec2.appendChild(el('div','code',d.answerBankCode));
  } else {
    var reasonMap={
      escalate:reasonTxt||'ללא סיבה מפורטת',
      error:'שגיאה בהרצה — '+reasonTxt,
      silence:'לא נדרש מענה מהסוכן'+(reasonTxt?' — '+reasonTxt:'.'),
      dropped:'סונן אוטומטית'+(reasonTxt?' — '+reasonTxt:' (תודה / אימוג׳י / הודעה לא רלוונטית).'),
    };
    var row=el('div','noDraftRow');
    row.appendChild(el('div','noDraftReason','לא נוצרה טיוטה — '+(reasonMap[d.outcome]||reasonTxt||'—')));
    var writeBtn=el('button','btnGhost','כתוב טיוטה בכל זאת');
    writeBtn.type='button';
    writeBtn.addEventListener('click',function(){ regenerate(d.chatJid, writeBtn, true); });
    row.appendChild(writeBtn);
    sec2.appendChild(row);
  }
  body.appendChild(sec2);

  if(d.referenceText){
    var rw=el('div','refWrap section');
    rw.appendChild(el('div','lbl',null));
    rw.lastChild.appendChild(document.createTextNode('מה שנשלח בפועל בשיחה'));
    var rq=el('div','quoteBox');
    var rt=el('div');rt.setAttribute('dir','auto');rt.textContent=d.referenceText;rq.appendChild(rt);
    rw.appendChild(rq);
    body.appendChild(rw);
  }

  card.appendChild(body);
  return card;
}

// ready = has a draft to review (clean OR blocked OR escalate-with-suggestion)
// waiting = queued, genuinely nothing to copy yet
// The API only ever returns queued (isQueued) rows now — this screen is
// "what needs a reply", full stop. Filtering here too is just cheap defense
// if that ever changes.
function splitByTab(drafts){
  var queued=(drafts||[]).filter(function(d){ return !!d.isQueued; });
  return {
    ready: queued.filter(function(d){ return !!d.draftText; }),
    waiting: queued.filter(function(d){ return !d.draftText; }),
  };
}

function render(data){
  lastData=data;
  var admin=data.scope==='firm';
  document.getElementById('meta').textContent=(function(){
    var g=splitByTab(data.drafts||[]);
    return g.ready.length+' טיוטות לאישור · '+g.waiting.length+' ממתינות';
  })();
  document.getElementById('toolRow').style.display=admin?'flex':'none';
  document.getElementById('toolRowStaff').style.display=admin?'none':'flex';
  document.getElementById('bottomRow').style.display=admin?'flex':'none';
  document.getElementById('tabRow').style.display='flex';

  var groups=splitByTab(data.drafts||[]);
  document.getElementById('cntReady').textContent=' ('+groups.ready.length+')';
  document.getElementById('cntWaiting').textContent=' ('+groups.waiting.length+')';

  var list=groups[activeTab]||[];
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    list=list.filter(function(d){
      return ((d.chatLabel||'')+' '+(d.clientName||'')).toLowerCase().indexOf(q)!==-1;
    });
  }
  var cards=document.getElementById('cards');
  cards.innerHTML='';
  if(!list.length){
    var msg;
    if(searchQuery){
      msg = 'אין תוצאות התואמות לחיפוש.';
    } else if(activeTab==='ready'){
      msg = admin ? 'אין כרגע טיוטות מוכנות. לחצו על "הכן טיוטות לשיחות ממתינות".' : 'אין כרגע תשובות מוכנות לכם.';
    } else {
      msg = 'אין כרגע שיחות שממתינות בלי טיוטה — 👍';
    }
    cards.appendChild(el('div','state',msg));
    return;
  }
  list.forEach(function(d){ cards.appendChild(renderCard(d)); });
}

function load(){
  document.getElementById('meta').textContent='טוען…';
  fetch('/api/wa-review',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}})
    .then(function(r){
      if(r.status===401){ goSignIn(); return null; }
      if(!r.ok) throw new Error('bad status '+r.status);
      clearAuthBounce();
      return r.json();
    })
    .then(function(data){ if(data) render(data); })
    .catch(function(e){
      document.getElementById('meta').textContent='שגיאה בטעינה';
      document.getElementById('cards').innerHTML='';
      document.getElementById('cards').appendChild(el('div','state','לא ניתן לטעון את הרשימה. נסו רענון.'));
    });
}

function runAdmin(btn, path, note){
  btn.disabled=true; var orig=btn.textContent; btn.textContent='מריץ…';
  fetch(path,{method:'POST',credentials:'same-origin'})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      btn.disabled=false; btn.textContent=orig;
      if(!res.ok){ alert('נכשל: '+((res.j&&res.j.error)||'שגיאה')); return; }
      if(note) alert(note(res.j.result));
      load();
    })
    .catch(function(){ btn.disabled=false; btn.textContent=orig; alert('נכשל להריץ.'); });
}

document.getElementById('queueBtn').addEventListener('click',function(){
  runAdmin(this,'/api/admin/wa-review/queue?limit=200',function(r){
    if(!r) return 'הסתיים.';
    var extra=[];
    if(r.alreadyDrafted) extra.push(r.alreadyDrafted+' כבר היו עם טיוטה');
    if(r.noText) extra.push(r.noText+' ללא טקסט לקריאה (וידאו/סטיקר/שגיאת פענוח)');
    return r.queued+' שיחות ממתינות כרגע · נוצרו '+r.ran+' טיוטות חדשות'+(extra.length?' ('+extra.join(', ')+')':'')+'.';
  });
});
document.getElementById('reconcileBtn').addEventListener('click',function(){
  runAdmin(this,'/api/admin/wa-review/reconcile?limit=500',function(r){
    return r ? ('נבדקו '+r.checked+', נמצאה תשובה בפועל עבור '+r.filled+'.') : 'הסתיים.';
  });
});
document.getElementById('refreshBtn').addEventListener('click',load);
document.getElementById('refreshBtn2').addEventListener('click',load);

document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(c){c.classList.remove('on');});
    tab.classList.add('on');
    activeTab=tab.getAttribute('data-t');
    if(lastData) render(lastData);
  });
});

var searchEl=document.getElementById('searchBox');
if(searchEl){
  searchEl.addEventListener('input',function(){
    searchQuery=searchEl.value.trim();
    if(lastData) render(lastData);
  });
}

load();
</script>
</body>
</html>
